<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIP-BOY v10 :: tiling multiplexer</title>
<link rel="stylesheet" href="vendor/xterm.css">
<script src="vendor/xterm.js"></script>
<script src="vendor/xterm-fit.js"></script>
<style>
:root{
  --bg:#0a100d; --surface:rgba(20,30,24,.75); --surface2:rgba(28,40,32,.6);
  --line:rgba(var(--rgb-acc),.10); --line2:rgba(var(--rgb-acc),.22);
  --txt:#e8f2ea; --dim:#93a99a; --faint:#5a6e62;
  --leaf:#4ade80; --water:#22d3ee; --sun:#a3e635; --rot:#f43f5e; --spore:#c084fc;
  /* RGB-компоненты для rgba(var(--x),alpha): темы перекрашивают и полупрозрачное */
  --rgb-acc:163,230,53; --rgb-leaf:74,222,128; --rgb-rot:244,63,94;
  --rgb-water:34,211,238; --rgb-spore:192,132,252;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}

/* --- темы: phosphor (дефолт) / amber / ice --- */
:root[data-theme=amber]{
  --bg:#120c05; --surface:rgba(38,27,11,.78); --surface2:rgba(54,38,14,.6);
  --txt:#fdf3e3; --dim:#c2a87a; --faint:#8a7452;
  --leaf:#fbbf24; --water:#38bdf8; --sun:#f59e0b; --rot:#fb7185; --spore:#e9d5ff;
  --rgb-acc:245,158,11; --rgb-leaf:251,191,36; --rgb-rot:251,113,133;
  --rgb-water:56,189,248; --rgb-spore:233,213,255;
}
:root[data-theme=ice]{
  --bg:#060b12; --surface:rgba(17,29,44,.78); --surface2:rgba(24,40,58,.6);
  --txt:#e6f2ff; --dim:#8fa8c0; --faint:#5a738c;
  --leaf:#38bdf8; --water:#22d3ee; --sun:#7dd3fc; --rot:#fb7185; --spore:#a5b4fc;
  --rgb-acc:125,211,252; --rgb-leaf:56,189,248; --rgb-rot:251,113,133;
  --rgb-water:34,211,238; --rgb-spore:165,180,252;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:13px;line-height:1.45}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(var(--rgb-acc),.12);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
::selection{background:rgba(var(--rgb-acc),.25)}

#app{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr auto;height:100vh}
.pb-topbar{grid-column:1/-1}
.pb-sbar{grid-column:1/-1}

/* rail виджетов (левая навигация по модулям) */
.pb-rail{grid-column:1;grid-row:2;width:52px;display:flex;flex-direction:column;gap:2px;
  padding:8px 6px;overflow-y:auto;overflow-x:hidden;border-right:1px solid var(--line);
  background:rgba(10,16,13,.6);backdrop-filter:blur(10px);transition:width .16s ease}
.pb-rail.wide{width:168px}
.rail-toggle{background:transparent;border:1px solid var(--line);color:var(--dim);cursor:pointer;
  font-family:var(--mono);font-size:10px;padding:3px 0;border-radius:6px;margin-bottom:4px}
.rail-toggle:hover{color:var(--txt);border-color:var(--line2)}
.rail-grp{font-size:7.5px;letter-spacing:1.2px;color:var(--faint);padding:6px 4px 3px;text-transform:uppercase}
.pb-rail:not(.wide) .rail-grp{display:none}
.rail-item{display:flex;align-items:center;gap:8px;background:transparent;border:0;color:var(--dim);
  cursor:pointer;font-family:var(--mono);font-size:10px;padding:5px 6px;border-radius:7px;
  white-space:nowrap;overflow:hidden;text-align:left}
.rail-item:hover{color:var(--txt);background:rgba(var(--rgb-acc),.06)}
.rail-item.active{color:var(--leaf);background:rgba(var(--rgb-leaf),.10)}
.rail-ico{width:16px;flex:0 0 auto;text-align:center;font-size:11px}
.rail-lbl{overflow:hidden;text-overflow:ellipsis}
.pb-rail:not(.wide) .rail-lbl{display:none}
.rail-badge{margin-left:auto;font-size:8px;font-family:var(--mono);color:var(--sun);
  background:rgba(var(--rgb-acc),.12);border-radius:99px;padding:0 5px}
.rail-badge.rot{color:var(--rot);background:rgba(var(--rgb-rot),.14)}
.pb-rail:not(.wide) .rail-badge{position:absolute;display:none}

/* topbar */
.pb-topbar{padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);backdrop-filter:blur(14px);background:rgba(10,16,13,.8)}
.pb-logo{font-weight:800;font-size:15px;letter-spacing:.3px}
.pb-logo b{color:var(--leaf);text-shadow:0 0 14px rgba(var(--rgb-leaf),.5)}
.pb-tag{font-size:9.5px;color:var(--faint);letter-spacing:2px;text-transform:uppercase;
  border:1px solid var(--line2);border-radius:99px;padding:2px 10px}
.pb-projects{display:flex;gap:4px;flex-wrap:wrap}
.pb-profile-label{display:flex;align-items:center;gap:5px;color:var(--faint);font-size:9px;letter-spacing:1px;text-transform:uppercase}
.pb-profile-label select{background:var(--surface2);border:1px solid var(--line2);color:var(--txt);font-family:var(--mono);font-size:10px;padding:4px 7px;border-radius:7px}
.pb-proj{background:transparent;border:1px solid var(--line);color:var(--dim);font-family:var(--sans);
  font-size:11px;padding:3px 12px;cursor:pointer;border-radius:99px;transition:all .15s}
.pb-proj:hover{color:var(--txt);border-color:var(--line2)}
.pb-proj.active{color:var(--leaf);border-color:rgba(var(--rgb-leaf),.5);background:rgba(var(--rgb-leaf),.08)}
.pb-btn{background:transparent;border:1px solid var(--line);color:var(--dim);font-family:var(--sans);
  font-size:12px;padding:4px 10px;cursor:pointer;border-radius:8px}
.pb-btn:hover{color:var(--txt);border-color:var(--line2)}
.spacer{flex:1}

/* main = тайловая сетка */
.pb-main{padding:10px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
  grid-auto-rows:minmax(240px,auto);gap:10px;align-content:start}
.tile{border:1px solid var(--line);border-radius:16px;background:var(--surface);
  display:flex;flex-direction:column;min-height:0;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.tile:hover{border-color:rgba(var(--rgb-leaf),.25);box-shadow:0 0 18px rgba(var(--rgb-leaf),.06)}
.tile.dragging{opacity:.55;border-style:dashed}
.tile-wide{grid-column:span 2}
.tile-focused{border-color:rgba(var(--rgb-leaf),.7)!important;box-shadow:0 0 0 1px rgba(var(--rgb-leaf),.4),0 0 26px rgba(var(--rgb-leaf),.14)}
.tile-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);
  cursor:grab;user-select:none;background:var(--surface2)}
/* skeleton / ошибка тайла */
.skel{display:flex;flex-direction:column;gap:8px;padding:4px 0}
.sk{height:10px;border-radius:4px;background:linear-gradient(90deg,rgba(var(--rgb-acc),.05),rgba(var(--rgb-acc),.13),rgba(var(--rgb-acc),.05));
  background-size:200% 100%;animation:skshine 1.4s ease-in-out infinite}
.sk-1{width:72%}.sk-2{width:90%}.sk-3{width:64%}.sk-4{width:48%;height:22px}
@keyframes skshine{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.tile-err{display:flex;flex-direction:column;gap:6px;align-items:flex-start;
  border-left:2px solid var(--rot);padding:6px 8px;background:rgba(var(--rgb-rot),.05)}
.tile-err .rot{font-size:10px;font-weight:600}
.tile-err .dim{font-size:9px;word-break:break-word;max-width:100%}

/* compact-плотность */
.pb-main.compact{gap:6px;padding:6px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  grid-auto-rows:minmax(180px,auto)}
.pb-main.compact .tile{border-radius:10px}
.pb-main.compact .tile-head{padding:5px 9px;gap:6px}
.pb-main.compact .tile-body{padding:8px}
body:not(.mobile) .pb-main.compact{font-size:12px}

/* focus2: активный тайл большой, остальные — полоски-заголовки */
.pb-main[data-layout=focus2]{grid-template-columns:1fr;grid-auto-rows:min-content;align-content:start}
.pb-main[data-layout=focus2] .tile:not(.tile-focused){overflow:hidden}
.pb-main[data-layout=focus2] .tile:not(.tile-focused) .tile-body{display:none}
.pb-main[data-layout=focus2] .tile:not(.tile-focused) .tile-head{border-bottom:0;cursor:pointer}
.pb-main[data-layout=focus2] .tile-focused{min-height:62vh}

/* фуллскрин тайла */
.tile-full{position:fixed;inset:0;z-index:9998;margin:0;border-radius:0;
  background:var(--bg);display:flex;flex-direction:column;max-height:none!important}
.tile-full .tile-head{position:sticky;top:0;background:rgba(10,16,13,.96);backdrop-filter:blur(8px);z-index:1}
.tile-full .tile-body{flex:1;overflow:auto;min-height:0}
.tile-head .tf{margin-left:auto;background:transparent;border:0;color:var(--faint);cursor:pointer;font-size:12px}
.tile-head .tf:hover{color:var(--leaf)}
.tile-head .tx{margin-left:6px}
body.has-full .pb-main{overflow:hidden}

.tdot{font-family:var(--mono);font-size:8.5px;line-height:1;min-width:15px;padding:1px 4px;
  border-radius:99px;color:var(--faint);background:rgba(var(--rgb-acc),.10);text-align:center}
.tdot:empty{display:none}
.tdot.warn{color:var(--sun);background:rgba(var(--rgb-acc),.16)}
.tdot.rot{color:var(--rot);background:rgba(var(--rgb-rot),.16);box-shadow:0 0 10px rgba(var(--rgb-rot),.25)}
.tdot.leaf{color:var(--leaf);background:rgba(var(--rgb-leaf),.14)}
.tile-head .t{font-size:10px;color:var(--faint);letter-spacing:1.6px;text-transform:uppercase}
.tile-head .tp{font-size:10px;color:var(--water);font-family:var(--mono)}
.tile-head .tx{margin-left:auto;background:transparent;border:0;color:var(--faint);cursor:pointer;font-size:12px}
.tile-head .tx:hover{color:var(--rot)}
.tile-body{flex:1;min-height:0;overflow:auto;padding:10px 12px}

/* shared tile content */
.eco-head{font-size:11px;font-weight:650;margin-bottom:8px;color:var(--txt)}
.csect{margin:12px 0 6px;font-size:9.5px;color:var(--faint);letter-spacing:1.8px;text-transform:uppercase;
  display:flex;align-items:center;gap:6px}
.csect:after{content:"";flex:1;height:1px;background:var(--line)}
.eco-row{display:flex;align-items:center;gap:8px;padding:5px 9px;border:1px solid var(--line);
  border-radius:10px;margin-bottom:4px;font-size:11.5px;cursor:pointer;background:rgba(255,255,255,.015);
  transition:border-color .12s}
.eco-row:hover{border-color:rgba(var(--rgb-leaf),.35)}
.eco-row b{font-family:var(--mono);font-size:10.5px;color:var(--leaf)}
.eco-row .grow{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
.eco-row .st{font-style:normal;font-family:var(--mono);font-size:9px}
.proj-row{display:flex;align-items:center;gap:8px;padding:6px 9px;border:1px solid var(--line);
  border-radius:10px;margin-bottom:4px;font-size:12px;cursor:pointer}
.proj-row:hover{border-color:rgba(var(--rgb-water),.35)}
.proj-row b{color:var(--water)}
.pb-mini{background:var(--surface2);border:1px solid var(--line2);color:var(--dim);font-family:var(--sans);
  font-size:10px;padding:2px 9px;cursor:pointer;border-radius:8px;transition:all .12s}
.pb-mini:hover{color:var(--txt);border-color:var(--line2)}
.pb-mini.up{color:var(--leaf);border-color:rgba(var(--rgb-leaf),.4)}
.stage-bar{display:flex;gap:4px;flex-wrap:wrap}
.stage{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;
  padding:2px 9px;font-size:9.5px;color:var(--dim)}
.stage b{color:var(--txt);font-family:var(--mono)}
.term-box{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.term-note{font-size:11px;color:var(--dim)}
.term-iframe-wrap{display:flex;flex-direction:column;flex:1;min-height:0}
.term-bar{display:flex;align-items:center;gap:8px;padding:4px 10px;background:var(--surface2);border-bottom:1px solid var(--line)}
.term-bar .term-proj{font-family:var(--mono);font-size:10px;color:var(--water)}
.term-bar .term-status{font-size:9px;color:var(--leaf);letter-spacing:1px;text-transform:uppercase;
  animation:pulse-live 2s ease-in-out infinite}
@keyframes pulse-live{0%,100%{opacity:.7}50%{opacity:1}}
.term-iframe{flex:1;border:0;min-height:0;width:100%;background:#0a100d;border-radius:0 0 12px 12px}
.browser-bar{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.browser-frame{flex:1;min-height:160px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.mono{font-family:var(--mono)}
.dim{opacity:.55}
.grow{flex:1}

/* sbar */
.pb-sbar{padding:6px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);
  display:flex;gap:16px;backdrop-filter:blur(14px);background:rgba(10,16,13,.85);align-items:center}
.pb-sbar b{color:var(--txt);font-family:var(--mono);font-size:10px}
.pb-sbar b.live{color:var(--water)}
.pb-sbar kbd{background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:0 5px;
  font-family:var(--mono);font-size:9px;color:var(--dim)}

/* keymap overlay */
.pb-kmap{position:fixed;inset:0;background:rgba(4,8,6,.75);backdrop-filter:blur(6px);z-index:10000;
  display:flex;align-items:center;justify-content:center}
.kmap-box{width:460px;max-width:92vw;background:var(--surface);border:1px solid var(--line2);
  border-radius:18px;padding:22px 26px}
.kmap-box h3{letter-spacing:1px;margin-bottom:12px;font-size:14px}
.krow{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;color:var(--dim);
  border-bottom:1px solid var(--line)}
.krow b{color:var(--leaf);font-family:var(--mono);font-size:11px}

/* toast */
/* toast-стек: контейнер прозрачен для клика, каждый тост — нет */
.pb-toast{position:fixed;bottom:44px;right:18px;z-index:10002;display:flex;flex-direction:column;
  gap:6px;align-items:flex-end;pointer-events:none;max-width:min(420px,90vw)}
.toast-item{background:var(--surface);border:1px solid var(--line2);color:var(--txt);
  padding:9px 14px;font-size:12.5px;border-radius:14px;pointer-events:auto;
  display:flex;align-items:center;gap:10px;max-width:100%;
  box-shadow:0 8px 26px rgba(0,0,0,.35);animation:toastin .18s ease-out}
.toast-item.out{opacity:0;transform:translateY(6px);transition:all .18s}
.toast-item.err{border-color:rgba(var(--rgb-rot),.5)}
.toast-item .tt{flex:1;word-break:break-word}
.toast-act{background:transparent;border:1px solid var(--line2);color:var(--leaf);cursor:pointer;
  font-family:var(--mono);font-size:10px;padding:3px 10px;border-radius:8px;white-space:nowrap}
.toast-act:hover{border-color:rgba(var(--rgb-leaf),.55);background:rgba(var(--rgb-leaf),.08)}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.toast-item{animation:none}}

@media (max-width:700px){
  .pb-main{grid-template-columns:1fr}
  .tile-wide{grid-column:span 1}
}

/* --- layout presets (data-layout на .pb-main) --- */
.pb-main[data-layout="columns"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.pb-main[data-layout="columns"] .tile-wide{grid-column:span 2}
.pb-main[data-layout="columns"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.pb-main[data-layout="treetab"]{grid-template-columns:200px 1fr;grid-auto-rows:minmax(260px,auto)}
.pb-main[data-layout="treetab"] .tile-utility,.pb-main[data-layout="treetab"] .tile-side-left{grid-column:1}
.pb-main[data-layout="treetab"] .tile-main,.pb-main[data-layout="treetab"] .tile-side-right{grid-column:2}
.pb-main[data-layout="plasma"]{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));grid-auto-rows:minmax(220px,auto)}
.pb-main[data-layout="monad3"]{grid-template-columns:minmax(220px,.7fr) minmax(360px,1.5fr) minmax(220px,.7fr)}
.pb-main[data-layout="monad3"] .tile-main{grid-column:2}
.pb-main[data-layout="monad3"] .tile-side-left{grid-column:1}
.pb-main[data-layout="monad3"] .tile-side-right{grid-column:3}
.pb-main[data-layout="slice"]{grid-template-columns:260px minmax(360px,1fr);grid-auto-rows:minmax(240px,auto)}
.pb-main[data-layout="slice"] .tile-utility,.pb-main[data-layout="slice"] .tile-side-left{grid-column:1}
.pb-main[data-layout="slice"] .tile-main,.pb-main[data-layout="slice"] .tile-side-right{grid-column:2}
.pb-main[data-profile] .tile-collapsed .tile-body{display:none}
.pb-main[data-profile] .tile-collapsed{min-height:0;max-height:42px;overflow:hidden;cursor:pointer}
.pb-main[data-profile] .tile-collapsed .tile-head{border-bottom:0;cursor:pointer}
.pb-main[data-layout="rows"]{grid-template-columns:1fr}
.pb-main[data-layout="rows"] .tile-wide{grid-column:span 1}
.pb-main[data-layout="focus"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.pb-main[data-layout="focus"] .tile:nth-child(1){grid-column:1/-1;grid-row:span 1;min-height:340px}
.pb-main[data-layout="focus"] .tile-wide{grid-column:span 2}

.pb-layouts{display:flex;gap:3px}
.pb-layouts .pb-proj{padding:3px 8px}

/* --- acceptance dashboard --- */
.acc-card{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px;background:rgba(255,255,255,.015)}
.acc-head{display:flex;align-items:center;gap:8px;font-size:11px;flex-wrap:wrap}
.acc-id{font-family:var(--mono);font-size:10px;color:var(--leaf)}
.acc-stage{font-family:var(--mono);font-size:9px;letter-spacing:1px}
.acc-owner{font-size:9px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:1px 7px}
.acc-owner.warn{color:var(--sun);border-color:rgba(var(--rgb-acc),.4)}
.acc-body{margin-top:6px;display:flex;flex-direction:column;gap:3px}
.acc-line{font-size:10.5px;color:var(--dim);display:flex;gap:6px}
.acc-line .lbl{font-family:var(--mono);font-size:8.5px;color:var(--faint);letter-spacing:1px;flex:0 0 auto;min-width:62px}
.acc-line .lbl.rot{color:var(--rot)}
.acc-line .ev{color:var(--water);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.acc-meta{font-size:10.5px;color:var(--dim);margin-bottom:8px}

/* --- dependency graph --- */
.dep-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.dep-stats .stat{font-size:10px;color:var(--dim)}
.dep-stats .stat b{color:var(--txt);font-family:var(--mono)}
.dep-stats .stat.warn b{color:var(--sun)}
.cp-list{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.cp{font-family:var(--mono);font-size:9px;color:var(--sun);border:1px solid rgba(var(--rgb-acc),.3);
  border-radius:99px;padding:2px 8px;cursor:pointer}
.cp b{color:var(--txt)}
.dep-svg-wrap{width:100%;overflow:hidden;border:1px solid var(--line);border-radius:10px}
.dep-svg{width:100%;min-width:0;height:auto;display:block;background:rgba(255,255,255,.012)}
.dep-toolbar{display:flex;gap:4px;align-items:center;margin-bottom:6px}
.dep-zoom-label{font-size:9px;margin-left:auto}
.dep-legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.lg{font-size:9px;color:var(--dim);display:inline-flex;align-items:center;gap:4px}
.lg i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* --- link resolver --- */
.link-form{display:flex;gap:6px;margin-bottom:8px}
.link-input{flex:1;background:var(--surface2);border:1px solid var(--line2);color:var(--txt);
  font-family:var(--mono);font-size:11px;padding:6px 10px;border-radius:8px;outline:0}
.link-input:focus{border-color:rgba(var(--rgb-leaf),.5)}
.link-result{font-size:10.5px;margin-bottom:8px;word-break:break-all}
.lk-kind{font-family:var(--mono);font-size:9px;color:var(--water);border:1px solid var(--line2);
  border-radius:99px;padding:1px 7px;margin-right:6px}
.lk-path{font-family:var(--mono);font-size:10px;color:var(--txt)}
.link-actions{display:flex;gap:5px;flex-wrap:wrap}

/* --- workspace launcher --- */
.ws-status{font-size:11px;margin-bottom:8px;color:var(--dim)}
.ws-status.up{color:var(--leaf)}
.ws-wins{display:flex;gap:5px;flex-wrap:wrap}
.ws-win{font-family:var(--mono);font-size:9.5px;color:var(--water);border:1px solid var(--line2);
  border-radius:8px;padding:2px 8px}
.ws-row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:11px}
.ws-port{font-family:var(--mono);font-size:10px;color:var(--water)}
.ws-port.down{color:var(--dim)}
.ws-health{font-size:9px;font-family:var(--mono)}
.ws-health.up{color:var(--leaf)}
.ws-health.down{color:var(--faint)}
.launch-actions{display:flex;gap:6px;margin-top:10px}

/* mobile stack */
body.mobile .pb-topbar{gap:6px;padding:8px 10px;flex-wrap:nowrap;overflow-x:auto}
body.mobile .pb-tag{display:none}
body.mobile .pb-logo{font-size:14px}
body.mobile .pb-projects{display:flex;overflow-x:auto;flex:1;gap:4px;scrollbar-width:none}
body.mobile .pb-profile-label{display:none}
body.mobile .pb-projects::-webkit-scrollbar{display:none}
body.mobile .pb-btn{padding:8px 12px;font-size:13px}
body.mobile #app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto auto}
body.mobile .pb-rail{grid-column:1;grid-row:3;width:auto;flex-direction:row;gap:4px;padding:6px 8px;
  overflow-x:auto;overflow-y:hidden;border-right:0;border-top:1px solid var(--line);scrollbar-width:none}
body.mobile .pb-rail::-webkit-scrollbar{display:none}
body.mobile .pb-rail.wide{width:auto}
body.mobile .rail-toggle{display:none}
body.mobile .rail-grp{display:none}
body.mobile .rail-item{flex:0 0 auto;padding:8px 12px;font-size:11px}
/* перебиваем .pb-rail:not(.wide) .rail-lbl{display:none} — на mobile подписи нужны */
body.mobile .pb-rail .rail-lbl{display:inline}
body.mobile .pb-main{padding:8px;gap:8px}
body.mobile .tile{min-height:260px}
body.mobile .tile-head{cursor:default;padding:10px 12px}
body.mobile .tile-body{padding:10px}
body.mobile .pb-mini{padding:6px 12px;font-size:12px}
body.mobile .pb-sbar{flex-wrap:wrap;gap:8px;padding:8px 12px;font-size:10px}
body.mobile .pb-sbar .spacer{display:none}
/* mobile-полировка: крупнее цели касания и читаемость таблиц */
body.mobile .mdl-row{grid-template-columns:1fr 1fr;gap:6px;padding:8px 0}
body.mobile .mdl-select{padding:8px 10px;font-size:11.5px}
body.mobile .mdl-cur{font-size:10.5px;white-space:normal}
body.mobile .kb-col{min-width:150px}
body.mobile .sk-4{height:16px}

/* типографика: единые кепсы для служебных подписей */
.eco-head{letter-spacing:1.4px;font-size:10.5px;color:var(--txt)}
.csect{letter-spacing:1.8px}
.lbl{font-size:8.5px;letter-spacing:1px;color:var(--faint);text-transform:uppercase}
body.mobile .pb-toast{bottom:80px;left:16px;right:16px}
body.mobile .pb-overlay{padding:12px}
body.mobile .palette,body.mobile .inspector,body.mobile .prompt{width:100%;max-height:92vh}
body.mobile .term-host{min-height:240px}
body.mobile .kmap-box{padding:16px}
@media (hover:none){
  .tile-head{cursor:default}
}

/* --- project numbers --- */
.pb-proj .pn{font-family:var(--mono);font-size:9px;color:var(--faint);margin-right:5px}
.pb-proj.active .pn{color:var(--leaf)}

/* --- terminal (embedded xterm) --- */
.term-host{display:flex;flex-direction:column;flex:1;min-height:0;height:100%}
.term-host .term-body{flex:1;min-height:0;padding:6px 10px;overflow:hidden;position:relative}
.term-host .term-body .xterm{height:100%}
.term-body .term-note{font-size:11px;color:var(--dim);padding:8px}
.term-body .pb-mini{margin:8px}

/* --- overlay / palette / inspector / prompt --- */
.pb-overlay{position:fixed;inset:0;background:rgba(5,8,6,.72);backdrop-filter:blur(4px);
  display:grid;place-items:center;z-index:1000;padding:24px}
.palette{width:min(560px,100%);background:var(--surface);border:1px solid var(--line2);
  border-radius:16px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.palette-head{padding:12px 16px;font-family:var(--mono);font-size:11px;color:var(--leaf);
  letter-spacing:1px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.palette-input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line2);
  color:var(--txt);font-size:14px;padding:12px 16px;outline:0;font-family:var(--mono)}
.palette-list{max-height:50vh;overflow-y:auto;padding:6px}
.palette-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.palette-item.sel{background:rgba(var(--rgb-acc),.10)}
.palette-item kbd{margin-left:auto;font-size:9px;color:var(--faint);border:1px solid var(--line2);border-radius:4px;padding:1px 5px}
.palette-empty{padding:16px;color:var(--dim);font-size:12px;text-align:center}

.prompt{width:min(420px,100%);background:var(--surface);border:1px solid var(--line2);
  border-radius:16px;padding:16px;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.prompt-head{font-family:var(--mono);font-size:11px;color:var(--leaf);letter-spacing:1px;margin-bottom:12px}
.prompt-input{width:100%;background:var(--surface2);border:1px solid var(--line2);color:var(--txt);
  font-size:13px;padding:10px 12px;border-radius:8px;outline:0;font-family:var(--mono)}
.prompt-input:focus{border-color:rgba(var(--rgb-leaf),.5)}
.prompt-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}

.inspector{width:min(720px,100%);max-height:86vh;background:var(--surface);border:1px solid var(--line2);
  border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.insp-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px}
.insp-head .mono.leaf{color:var(--leaf);font-size:13px}
.insp-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.insp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.insp-grid>div{font-size:11px;color:var(--dim)}
.insp-grid .lbl,.insp-sec .lbl{font-family:var(--mono);font-size:8.5px;color:var(--faint);letter-spacing:1px;margin-right:6px}
.insp-sec{font-size:11.5px;color:var(--dim);line-height:1.5}
.insp-sec .warn{color:var(--sun)}
.insp-art{display:flex;flex-direction:column;padding:4px 0}
.insp-art a{color:var(--water);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:11px}
.insp-art .mono{font-size:9px}
.insp-actions{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}

/* --- proposal queue --- */
.prop-row{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:11.5px}
.prop-row:hover{background:rgba(255,255,255,.02)}
.prop-row i{font-style:normal;width:14px;text-align:center;flex:0 0 auto}
.prop-text{flex:1;min-width:0;display:flex;flex-direction:column}
.prop-move{font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.prop-move b{color:var(--leaf)}
.prop-move.rot{color:var(--rot)}
.prop-row .pb-mini{flex:0 0 auto}

/* --- agent cockpit --- */
.agent-row{display:flex;gap:10px;padding:8px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer;background:rgba(255,255,255,.015)}
.agent-row:hover{border-color:rgba(var(--rgb-leaf),.3)}
.agent-avatar{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--leaf);display:grid;place-items:center;
  font-family:var(--mono);font-size:12px;color:var(--txt);flex:0 0 auto}
.agent-main{flex:1;min-width:0}
.agent-top{display:flex;align-items:center;gap:8px}
.agent-name{font-family:var(--mono);font-size:12px;color:var(--txt)}
.agent-status{font-family:var(--mono);font-size:8.5px;letter-spacing:1px}
.agent-role{font-size:10px;margin:2px 0 5px;line-height:1.35}
.agent-cards{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:9px;color:var(--leaf);border:1px solid var(--line2);border-radius:99px;padding:1px 7px}
.chip.rot{color:var(--rot);border-color:rgba(var(--rgb-rot),.3)}
.agent-routes{display:flex;gap:6px;flex-wrap:wrap}

/* --- next action --- */
.nx-row{display:flex;gap:8px;padding:7px 5px;border-bottom:1px solid var(--line);cursor:pointer;font-size:10.5px}
.nx-row:hover{background:rgba(255,255,255,.02)}
.nx-p{font-family:var(--mono);font-size:9px;font-weight:700;flex:0 0 auto;width:22px;padding-top:1px}
.nx-main{flex:1;min-width:0}
.nx-idline{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.nx-idline b{font-size:10.5px;color:var(--leaf)}
.nx-title{font-size:10.5px}
.nx-meta{display:flex;align-items:center;gap:6px;margin-top:2px;flex-wrap:wrap}
.nx-owner{font-size:9px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:0 6px}
.nx-owner.warn{color:var(--sun);border-color:rgba(var(--rgb-acc),.35)}
.nx-proj{font-size:9px;color:var(--water)}
.nx-lc{font-size:8.5px;color:var(--faint);letter-spacing:1px}
.nx-reasons{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.nx-reason{font-family:var(--mono);font-size:8px;color:var(--rot);border:1px solid rgba(var(--rgb-rot),.25);
  border-radius:99px;padding:0 6px}
.nx-empty{padding:4px 0;color:var(--faint);font-size:10px}
.nx-filter{display:flex;gap:4px;margin-bottom:8px}
.nx-filter .pb-mini.nx-active{color:var(--leaf);border-color:rgba(var(--rgb-leaf),.5);background:rgba(var(--rgb-leaf),.08)}

/* --- search --- */
.search-input{width:100%;background:var(--surface2);border:1px solid var(--line2);color:var(--txt);
  font-family:var(--mono);font-size:12px;padding:8px 10px;border-radius:8px;outline:0;margin-bottom:8px}
.search-input:focus{border-color:rgba(var(--rgb-leaf),.5)}
.search-facets{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.facet-chip{font-size:9px;color:var(--dim);border:1px solid var(--line2);border-radius:99px;padding:1px 8px;cursor:pointer;background:transparent}
.facet-chip.on{color:var(--leaf);border-color:rgba(var(--rgb-leaf),.5);background:rgba(var(--rgb-leaf),.1)}
.search-count{font-size:10px;margin-bottom:6px}
.search-results{max-height:340px;overflow-y:auto}
.sr-row{display:flex;align-items:baseline;gap:8px;padding:5px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:11px}
.sr-row:hover{background:rgba(255,255,255,.02)}
.sr-row b{font-size:10.5px;color:var(--leaf)}
.sr-title{flex:1;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-meta{font-family:var(--mono);font-size:8.5px;color:var(--dim)}
.sr-proj{font-size:9px;color:var(--water)}

/* --- clickable wikilinks --- */
.wl{color:var(--water);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-family:var(--mono);font-size:0.95em}
.wl:hover{color:var(--leaf);background:rgba(var(--rgb-leaf),.08);border-radius:2px}

/* --- health radar + heatmap --- */
.hr-list{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.hr-proj{display:flex;align-items:center;gap:8px;cursor:pointer}
.hr-proj:hover .hr-name{color:var(--leaf)}
.hr-name{font-size:10.5px;color:var(--dim);width:70px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hr-bar{flex:1;height:12px;border-radius:6px;overflow:hidden;display:flex;background:rgba(255,255,255,.03)}
.hr-seg{height:100%}
.hr-seg.healthy{background:var(--leaf)}
.hr-seg.inflight{background:var(--water)}
.hr-seg.stale{background:#3a4a40}
.hr-nums{font-size:8.5px;color:var(--faint);width:44px;flex:0 0 auto;text-align:right}
.hm{display:flex;flex-direction:column;gap:2px;margin-bottom:8px;overflow-x:auto}
.hm-row{display:flex;gap:2px;align-items:center;min-width:460px}
.hm-head .hm-lc{font-size:7.5px;color:var(--faint);text-align:center}
.hm-layer{font-family:var(--mono);font-size:9px;color:var(--dim);width:26px;flex:0 0 auto}
.hm-cell{flex:1;height:18px;border-radius:3px;display:grid;place-items:center;font-family:var(--mono);font-size:8px;color:var(--txt);min-width:20px}
.hm-lc{flex:1;font-size:0;min-width:20px}

/* --- cycle / alert chips (dependency graph) --- */
.csect.rot{color:var(--rot)}
.csect.rot b{color:var(--rot)}
.cp.cyc{color:var(--rot);border-color:rgba(var(--rgb-rot),.4)}
.cp.na{color:var(--rot);border-color:rgba(var(--rgb-rot),.35);border-style:dashed}
.cp.bt{color:var(--sun);border-color:rgba(251,191,36,.4)}
.cp.bt b{color:var(--water);cursor:pointer}
.cp.bt b:hover{text-decoration:underline}
.stat.rot b{color:var(--rot)}

/* --- kanban --- */
.kb-count{font-size:10px;margin-bottom:8px}
.kb-count b{color:var(--txt);font-family:var(--mono)}
.kb-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.kb-col{min-width:130px;flex:1}
.kb-colhead{font-size:9px;font-family:var(--mono);color:var(--c,var(--dim));
  display:flex;justify-content:space-between;align-items:center;padding:4px 6px;margin-bottom:6px;
  border-bottom:1.5px solid var(--c,var(--line2))}
.kb-colhead b{background:rgba(20,30,24,.6);border-radius:99px;padding:0 7px}
.kb-list{display:flex;flex-direction:column;gap:5px}
.kb-card{border:1px solid var(--line);border-radius:8px;padding:5px 7px;cursor:pointer;
  background:var(--surface2);transition:border-color .12s}
.kb-card:hover{border-color:var(--line2)}
.kb-id{font-family:var(--mono);font-size:9px;color:var(--water);display:block}
.kb-title{font-size:10px;color:var(--txt);display:block;margin:1px 0}
.kb-meta{font-size:8.5px;color:var(--faint)}
.kb-empty{font-size:9px;color:var(--faint)}

/* --- matrix --- */
.mx-tabs{display:flex;gap:4px;margin-bottom:8px}
.mx-tabs .pb-mini.on{color:var(--leaf);border-color:rgba(var(--rgb-leaf),.5);background:rgba(var(--rgb-leaf),.08)}
.mx-scroll{overflow-x:auto}
.mx-row{display:flex;gap:3px;align-items:stretch;min-width:640px;margin-bottom:3px}
.mx-head .mx-lch{font-size:7.5px;color:var(--faint);text-align:center}
.mx-key{font-family:var(--mono);font-size:9px;color:var(--dim);width:64px;flex:0 0 auto;
  display:flex;align-items:center}
.mx-lch{flex:1;font-family:var(--mono);font-size:8px;color:var(--c,var(--dim));text-align:center}
.mx-cell{flex:1;min-height:26px;border-radius:5px;background:color-mix(in srgb,var(--c,#5a6e62) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--c,#5a6e62) 30%,transparent);
  display:flex;flex-wrap:wrap;gap:2px;align-items:center;justify-content:center;padding:2px}
.mx-cell b{font-family:var(--mono);font-size:9px;color:var(--txt);opacity:.72}
.mx-chip{font-family:var(--mono);font-size:7.5px;color:var(--dim);cursor:pointer}
.mx-chip:hover{color:var(--txt);text-decoration:underline}

/* --- skills graph --- */
.skill-panel{border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px;min-height:40px}
.skill-title{font-size:12px;font-weight:650;margin-bottom:4px}
.skill-title .dim{font-size:12px}
.skill-meta{font-size:9.5px;color:var(--faint);margin:4px 0}
.skill-row{font-size:9.5px;color:var(--dim);margin:2px 0}
.skill-row code{font-family:var(--mono);color:var(--sun);background:var(--surface2);border-radius:4px;padding:0 4px;margin-right:3px}
.skill-quests{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.sq{font-size:9.5px;color:var(--dim)}
.sq.ok{color:var(--leaf)}
.sq .dim{color:var(--faint);margin-left:4px}

/* --- проектная панель (статус по всем проектам) --- */
.pj-sum{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:9.5px;margin-bottom:7px}
.pj-sum b{color:var(--txt);font-family:var(--mono)}
.pj-sum .leaf{color:var(--leaf)}
.pj-sum .warn{color:var(--sun)}
.pj-legend{margin-left:auto;color:var(--faint);font-size:8.5px}
.pj-list{display:flex;flex-direction:column;gap:5px}
.proj-row{display:flex;align-items:center;gap:7px;padding:6px 9px;border:1px solid var(--line);
  border-radius:9px;cursor:pointer;background:var(--surface2);transition:border-color .12s;font-size:11px}
.proj-row:hover{border-color:rgba(var(--rgb-water),.35)}
.proj-row.active{border-color:rgba(var(--rgb-leaf),.55);background:rgba(var(--rgb-leaf),.07)}
.proj-row.err{border-color:rgba(var(--rgb-rot),.35);cursor:default}
.proj-row b{color:var(--water);font-family:var(--mono);font-size:10.5px}
.proj-row.active b{color:var(--leaf)}
.pj-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--faint)}
.pj-dot.up{background:var(--leaf);box-shadow:0 0 8px rgba(var(--rgb-leaf),.55)}
.pj-dot.down{background:var(--faint)}
.pj-status{font-size:8.5px;color:var(--dim);border:1px solid var(--line2);border-radius:99px;padding:0 6px}
.pj-ports{display:flex;gap:3px;flex:0 0 auto}
.pj-port{font-family:var(--mono);font-size:8.5px;padding:1px 5px;border-radius:5px;
  border:1px solid transparent;cursor:default}
.pj-port.up{color:var(--leaf);background:rgba(var(--rgb-leaf),.12);border-color:rgba(var(--rgb-leaf),.3)}
.pj-port.down{color:var(--rot);background:rgba(var(--rgb-rot),.10);border-color:rgba(var(--rgb-rot),.28)}
.pj-none{font-size:9px}
.pj-wins,.pj-docker{font-family:var(--mono);font-size:9px;color:var(--dim);min-width:26px;text-align:right}
.pj-docker:not(:empty){color:var(--water)}

/* --- MODELS dashboard --- */
.mdl-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.mdl-filter{flex:1;min-width:160px;background:var(--surface2);border:1px solid var(--line2);
  color:var(--txt);font-family:var(--mono);font-size:11px;padding:5px 9px;border-radius:8px;outline:0}
.mdl-filter:focus{border-color:rgba(var(--rgb-leaf),.5)}
.mdl-count{font-size:9.5px}
.mdl-count b{color:var(--txt);font-family:var(--mono)}
.mdl-note{font-size:9.5px;line-height:1.5;margin-bottom:8px;padding:6px 8px;
  border-left:2px solid var(--line2);background:rgba(255,255,255,.015)}
.mdl-note code{font-family:var(--mono);color:var(--sun)}
.mdl-row{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(90px,.7fr) minmax(140px,1.3fr) minmax(150px,1.4fr);
  gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.mdl-name{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0}
.mdl-name b{font-family:var(--mono);font-size:10.5px;color:var(--txt);overflow:hidden;text-overflow:ellipsis}
.mdl-scope{font-family:var(--mono);font-size:7.5px;letter-spacing:.5px;padding:1px 5px;border-radius:99px}
.mdl-scope.global{color:var(--water);border:1px solid rgba(var(--rgb-water),.35)}
.mdl-scope.project{color:var(--spore);border:1px solid rgba(var(--rgb-spore),.35)}
.mdl-proj{font-size:8.5px;color:var(--faint)}
.mdl-meta{display:flex;flex-direction:column;gap:1px;font-size:8.5px;min-width:0}
.mdl-kind{color:var(--faint)}
.mdl-mode{color:var(--dim)}
.mdl-cur{font-family:var(--mono);font-size:9.5px;color:var(--leaf);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mdl-cur.rot{color:var(--rot)}
.mdl-select{width:100%;background:var(--surface2);border:1px solid var(--line2);color:var(--txt);
  font-family:var(--mono);font-size:9.5px;padding:4px 6px;border-radius:7px;outline:0;cursor:pointer}
.mdl-select:focus{border-color:rgba(var(--rgb-leaf),.5)}
.mdl-select:disabled{opacity:.5;cursor:wait}
.mdl-select.mdl-dirty{border-color:rgba(var(--rgb-leaf),.55);background:rgba(var(--rgb-leaf),.07)}
.mdl-providers{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}

</style>
</head>
<body>
<div id="app"></div>
<div class="pb-toast" id="pb-toast"></div>

<script type="module">
import { PipBoyApp } from "./app/core/App.js";

const app = new PipBoyApp(document.getElementById("app"));

// глобальный toast-канал: строка или {text, err, action:{label, run}}
const toastBox = document.getElementById("pb-toast");
const MAX_TOASTS = 3;

function pushToast(msg) {
  const spec = (typeof msg === "string") ? { text: msg } : (msg || {});
  const el = document.createElement("div");
  el.className = "toast-item" + (spec.err ? " err" : "");
  const span = document.createElement("span");
  span.className = "tt";
  span.textContent = String(spec.text ?? "");
  el.appendChild(span);

  let timer = null;
  const close = () => {
    clearTimeout(timer);
    el.classList.add("out");
    setTimeout(() => el.remove(), 200);
  };
  if (spec.action && typeof spec.action.run === "function") {
    const btn = document.createElement("button");
    btn.className = "toast-act";
    btn.textContent = spec.action.label || "действие";
    btn.addEventListener("click", () => { close(); spec.action.run(); });
    el.appendChild(btn);
  }
  toastBox.appendChild(el);
  // не даём стеку расти: убираем самые старые
  while (toastBox.children.length > MAX_TOASTS) toastBox.firstElementChild.remove();
  timer = setTimeout(close, spec.action ? 9000 : 2600);
}

app.eventBus.on("toast", pushToast);

await app.init();
</script>
</body>
</html>
