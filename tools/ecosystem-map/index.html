    if(!REGISTRY) return;
    const layers = Object.keys(REGISTRY.layers || {});
    const facets = Object.keys(REGISTRY.facets || {});
    const projects = [...new Set(Object.values(REGISTRY.cards || {}).map(c => c.project).filter(Boolean))].sort();
    const owners = [...new Set(Object.values(REGISTRY.cards || {}).map(c => c.owner).filter(Boolean))].sort();
    const priorities = (REGISTRY.priorities && REGISTRY.priorities.length) ? REGISTRY.priorities : ["P0","P1","P2","P3","P4"];
    const stages = LIFECYCLE_ORDER;
    const mk = (id, vals, labelFn) => {
      const el = document.getElementById(id);
      if(!el) return;
      el.innerHTML = vals.map(v => `<button class="pill" data-rf="${esc(id)}" data-val="${esc(v)}">${esc(labelFn ? labelFn(v) : v)}</button>`).join("");
    };
    mk("rf-layers", layers);
    mk("rf-facets", facets);
    mk("rf-projects", ["—", ...projects], v => v === "—" ? "ECOSYSTEM" : v);
    mk("rf-owners", owners);
    mk("rf-priorities", priorities);
    mk("rf-stages", stages);
    document.querySelectorAll("[data-rf]").forEach(p => {
      p.addEventListener("click", () => {
        const kind = p.getAttribute("data-rf");
        const val = p.getAttribute("data-val");
        const set = kind === "rf-layers" ? regFilters.layers
          : kind === "rf-facets" ? regFilters.facets
          : kind === "rf-projects" ? regFilters.projects
          : kind === "rf-owners" ? regFilters.owners
          : kind === "rf-priorities" ? regFilters.priorities
          : regFilters.stages;
        if(set.has(val)){ set.delete(val); p.classList.remove("active"); }
        else { set.add(val); p.classList.add("active"); }
        applyRegFilters();
      });
    });
    const search = document.getElementById("reg-search");
    if(search){
      search.addEventListener("input", () => {
        regFilters.search = search.value.trim();
        applyRegFilters();
      });
    }
    const clear = document.getElementById("rf-clear");
    if(clear){
      clear.addEventListener("click", () => {
        regFilters = { layers:new Set(), facets:new Set(), projects:new Set(), owners:new Set(), priorities:new Set(), stages:new Set(), search:"" };
        document.querySelectorAll("[data-rf]").forEach(p => p.classList.remove("active"));
        if(search) search.value = "";
        applyRegFilters();
      });
    }
  }
  function applyRegFilters(){
    if(CURRENT_VIEW !== "skills" && REGISTRY) renderView(CURRENT_VIEW);
    updateStats();
  }

  async function loadData(){
    const res = await fetch("data.json", {cache:"no-store"});
    if(!res.ok){ document.getElementById("panel-empty").innerHTML = "❌ data.json не найден. Подними хост: python3 tools/ecosystem-map/pipboy.py up"; return null; }
    return await res.json();
  }

  function loadUserState(){
    try{ return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); }catch{ return {}; }
  }
  function saveUserState(){ localStorage.setItem(STORE_KEY, JSON.stringify(userState)); }

/* =========================================================
   QUEST-DONE RESOLUTION
   merge data.done with user overrides (clickable checklist)
   ========================================================= */
function questDone(skillId, q){
  const u = userState[skillId];
  if(u && u.questsDone && u.questsDone[q.id] !== undefined) return u.questsDone[q.id];
  return !!q.done;
}
function setQuestDone(skillId, qid, val){
  if(!userState[skillId]) userState[skillId] = {questsDone:{}, masteredOverride:false};
  userState[skillId].questsDone = userState[skillId].questsDone || {};
  userState[skillId].questsDone[qid] = val;
  saveUserState();
}

/* =========================================================
   STATE COMPUTATION
   LOCKED  : хотя бы один prereq не (LEARNED|MASTERED)
   else if все квесты done -> LEARNED
        if LEARNED && все unlocks тоже LEARNED/MASTERED (или нет unlocks) -> MASTERED
        (override: user может вручную отметить MASTERED)
   else AVAILABLE
   ========================================================= */
function computeStates(){
  const skills = DATA.skills;
  const memo = {};
  // iteratively resolve (graph could have cycles? assume DAG, but iterate to stability)
  let changed = true, iter = 0;
  while(changed && iter < 50){
    changed = false; iter++;
    for(const id in skills){
      const s = skills[id];
      const prereqsDone = s.prereqs.every(p => {
        const st = memo[p];
        return st === "LEARNED" || st === "MASTERED";
      });
      let st;
      if(!prereqsDone) st = "LOCKED";
      else{
        const allQ = s.quests.every(q => questDone(id, q));
        if(allQ){
          const u = userState[id];
          const unlocksDone = s.unlocks.length === 0 || s.unlocks.every(u2 => {
            const ust = memo[u2]; return ust === "LEARNED" || ust === "MASTERED";
          });
          if(u && u.masteredOverride) st = "MASTERED";
          else st = unlocksDone ? "MASTERED" : "LEARNED";
        } else st = "AVAILABLE";
      }
      if(memo[id] !== st){ memo[id] = st; changed = true; }
    }
  }
  return memo;
}

/* =========================================================
   GRAPH BUILD
   ========================================================= */
let svg, g, linkg, nodeg, labelg, sim, zoom, tooltip;
let currentStates = {};
let filters = { branches:new Set(), projects:new Set(), states:new Set() };

function initSvg(){
  const wrap = document.getElementById("graph-wrap");
  svg = d3.select("#graph");
  // zoom/pan
  zoom = d3.zoom().scaleExtent([0.2,4]).on("zoom", e => g.attr("transform", e.transform));
  svg.append("defs");
  g = svg.append("g").attr("class","layer");
  svg.call(zoom);
  // marker arrows
  const defs = svg.select("defs");
  Object.entries(STATE_COLOR).forEach(([st,col])=>{
    defs.append("marker")
      .attr("id","arrow-"+st).attr("viewBox","0 -5 10 10")
      .attr("refX",22).attr("refY",0).attr("markerWidth",7).attr("markerHeight",7)
      .attr("orient","auto")
      .append("path").attr("d","M0,-4 L9,0 L0,4 L2,0").attr("fill",col);
  });
  linkg = g.append("g").attr("class","links");
  labelg = g.append("g").attr("class","labels");
  nodeg = g.append("g").attr("class","nodes");
  tooltip = d3.select("#tooltip");
}

function buildGraph(){
  const skills = DATA.skills;
  const nodes = Object.keys(skills).map(id => ({id, ...skills[id], state: currentStates[id]}));
  const nodeById = {};
  nodes.forEach(n => nodeById[n.id] = n);
  const links = [];
  Object.keys(skills).forEach(id => {
    const s = skills[id];
    (s.unlocks||[]).forEach(t => {
      if(skills[t]) links.push({source:id, target:t, type:"unlock"});
    });
  });

  // node radius by quest count
  nodes.forEach(n => { n.r = 14 + Math.min(n.quests.length,5)*2.2; });

  sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d=>d.id).distance(95).strength(0.5))
    .force("charge", d3.forceManyBody().strength(-280))
    .force("center", d3.forceCenter(centerX(), centerY()))
    .force("x", d3.forceX(centerX()).strength(0.03))
    .force("y", d3.forceY(centerY()).strength(0.04))
    .force("collide", d3.forceCollide().radius(d=>d.r+8));

  const link = linkg.selectAll("line").data(links).join("line")
    .attr("class","link")
    .attr("stroke", d => STATE_COLOR[currentStates[d.source.id] || currentStates[d.source] || "LOCKED"])
    .attr("marker-end", d => "url(#arrow-"+(currentStates[d.target.id || d.target]||"LOCKED")+")")
    .attr("opacity", .5);

  const label = labelg.selectAll("text").data(nodes).join("text")
    .attr("class","label-text")
    .attr("y", d => d.r + 11)
    .text(d => d.name);

  const node = nodeg.selectAll("g.node").data(nodes).join("g")
    .attr("class","node")
    .style("color", d => STATE_COLOR[d.state])
    .call(dragHandler());

  node.append("circle")
    .attr("r", d=>d.r)
    .attr("fill", "#031603")
    .attr("stroke", d=>STATE_COLOR[d.state])
    .attr("opacity", d => d.state==="LOCKED" ? 0.35 : 1)
    .style("filter", d => d.state==="LOCKED" ? "none" :
       (d.state==="MASTERED" ? "drop-shadow(0 0 8px #FFD700)" :
        d.state==="LEARNED" ? "drop-shadow(0 0 6px #ffb000)" :
        "drop-shadow(0 0 5px #00ff41)"));

  // mastered pulse: append a pulsing ring
  node.filter(d=>d.state==="MASTERED").each(function(d){
    d3.select(this).insert("circle",":first-child")
      .attr("r", d.r).attr("fill","none").attr("stroke","#FFD700")
      .attr("opacity",.6).attr("stroke-width",2)
      .style("animation","none"); // SVG SMIL would be needed; use class
  });
  // mastered pulse via JS rAF later (see animatePulse)
  node.filter(d=>d.state==="MASTERED").select("circle:first-child").classed("pulse", true);

  node.append("text").text(d=>d.icon).attr("y",0);

  node
    .on("mouseenter", (e,d)=> onHover(e,d))
    .on("mouseleave", ()=> tooltip.style("opacity",0))
    .on("click", (e,d)=>{ e.stopPropagation(); selectNode(d); });

  sim.on("tick", ()=>{
    link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
        .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    node.attr("transform", d=>`translate(${d.x},${d.y})`);
    label.attr("x", d=>d.x);
    label.attr("y", d=>d.y + d.r + 11);
  });

  // store refs
  sim._nodes = nodes; sim._links = links; sim._linkSel = link; sim._nodeSel = node; sim._labelSel = label;
}

function dragHandler(){
  return d3.drag()
    .subject(e=>e.subject)
    .on("start",(e,d)=>{ if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag",(e,d)=>{ d.fx=e.x; d.fy=e.y; })
    .on("end",(e,d)=>{ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; });
}

function centerX(){ return document.getElementById("graph-wrap").clientWidth/2; }
function centerY(){ return document.getElementById("graph-wrap").clientHeight/2; }

// mastered pulse animation
let t0 = 0;
function animatePulse(ts){
  t0 = ts;
  if(sim && sim._nodeSel){
    const pulseR = 14 + Math.sin(ts/300)*8;
    nodeg.selectAll(".node").selectAll("circle.pulse").attr("r",(d,i,n)=>{
      const baseR = d3.select(n[i].parentNode).datum().r;
      return baseR + 4 + Math.sin(ts/400+ (d && d.x||0)*0.01)*4;
    });
  }
  requestAnimationFrame(animatePulse);
}
requestAnimationFrame(animatePulse);

/* =========================================================
   HOVER + WHAT-IF
   ========================================================= */
function onHover(e, d){
  // highlight node + neighbors + links
  const neighbors = new Set([d.id]);
  (d.prereqs||[]).forEach(p=>neighbors.add(p));
  (d.unlocks||[]).forEach(u=>neighbors.add(u));

  sim._nodeSel.classed("dim", n=>!neighbors.has(n.id))
              .classed("node-highlight", n=>n.id===d.id);
  sim._labelSel.style("opacity", n=> neighbors.has(n.id) ? 1 : 0.12);
  sim._linkSel.classed("dim", l => !(l.source.id===d.id || l.target.id===d.id))
              .classed("link-hi", l => (l.source.id===d.id || l.target.id===d.id));

  // tooltip
  const tt = document.getElementById("tooltip");
  const unlocked = (d.unlocks||[]).map(u=>{
    const us = DATA.skills[u]; 
    return us ? us.name : u;
  });
  let whatif = "";
  if(d.state === "LOCKED"){
    const blocked = (d.prereqs||[]).filter(p=> currentStates[p]!=="LEARNED" && currentStates[p]!=="MASTERED")
      .map(p=> DATA.skills[p].name);
    whatif = blocked.length ? `🔒 Заблокировано: ${blocked.join(", ")}` : "";
  } else if(d.state === "AVAILABLE"){
    whatif = unlocked.length ? `⚡ Изучив это, откроется: ${unlocked.join(", ")}` : "Изучив это — закрепишь навык";
  } else {
    whatif = unlocked.length ? `→ Открывает: ${unlocked.join(", ")}` : "Терминальный навык";
  }
  const ndone = d.quests.filter(q=>questDone(d.id,q)).length;
  tt.innerHTML = `
    <div class="tt-title">${d.icon} ${d.name}</div>
    <div class="tt-state">${d.branch} · <span class="s-${d.state}">${d.state}</span> · ${ndone}/${d.quests.length} квестов</div>
    <div style="margin-top:4px;opacity:.85;font-size:10px">${d.desc||""}</div>
    ${whatif ? `<div class="tt-whatif">${whatif}</div>` : ""}
  `;
  const wrap = document.getElementById("graph-wrap");
  let x = e.offsetX + 14, y = e.offsetY + 14;
  tt.style.left = Math.min(x, wrap.clientWidth-280) + "px";
  tt.style.top = y + "px";
  tt.style.opacity = 1;
}

function clearHighlight(){
  if(!sim) return;
  sim._nodeSel.classed("dim", false).classed("node-highlight", false);
  sim._labelSel.style("opacity", 0.7);
  sim._linkSel.classed("dim", false).classed("link-hi", false);
}

/* =========================================================
   SELECT + PANEL
   ========================================================= */
let selectedId = null;

function selectNode(d){
  clearHighlight();
  selectedId = d.id;
  sim._nodeSel.classed("node-highlight", n=>n.id===d.id);
  renderPanel(d.id);
}

function renderPanel(id){
  const s = DATA.skills[id];
  if(!s) return;
  document.getElementById("panel-empty").style.display = "none";
  const pc = document.getElementById("panel-content");
  pc.style.display = "block";

  const st = currentStates[id];
  const ndone = s.quests.filter(q=>questDone(id,q)).length;
  const allDone = ndone === s.quests.length;

  // tools linked
  const linkedTools = (DATA.tools||[]).filter(t => (t.skills||[]).includes(id)).slice(0, 40);

  // panel head
  pc.innerHTML = `
    <div class="panel-head">
      <h2><span class="icon">${s.icon}</span>${s.name}</h2>
      <div style="margin-top:6px"><span class="state-badge s-${st}">${st}</span>
        <span style="margin-left:8px;font-size:10px;opacity:.7;color:var(--amber)">${s.branch}</span>
      </div>
    </div>
    <div class="panel-body">
      <div class="sect">
        <h3>Описание</h3>
        <div style="font-size:12px;opacity:.9">${s.desc || "—"}</div>
      </div>

      <div class="sect">
        <h3>Прогресс</h3>
        <div class="row"><span class="k">Квестов</span><span class="v">${ndone} / ${s.quests.length}</span></div>
        <div class="row"><span class="k">Пререквизиты</span><span class="v">${s.prereqs.length ? s.prereqs.map(p=>DATA.skills[p]?.name||p).join(", ") : "—"}</span></div>
        <div class="row"><span class="k">Открывает</span><span class="v">${s.unlocks.length ? s.unlocks.map(u=>DATA.skills[u]?.name||u).join(", ") : "—"}</span></div>
      </div>

      <div class="sect">
        <h3>Квесты (${ndone}/${s.quests.length})</h3>
        ${s.quests.length === 0 ? '<div class="empty" style="margin-top:8px">Нет квестов</div>' :
          s.quests.map(q=>{
            const done = questDone(id,q);
            return `<div class="quest ${done?"done":"todo"}" data-q="${q.id}">
              <div class="qcheck">${done?"✓":"☐"}</div>
              <div class="qbody">
                <div class="qtitle">${q.title}</div>
                ${q.desc?`<div class="qdesc">${q.desc}</div>`:""}
                <div class="qreward">${q.reward||""}</div>
              </div>
            </div>`;
          }).join("")}
      </div>

      <div class="sect">
        <h3>Влияние на проекты</h3>
        <div class="impact-grid">
          ${PROJECTS_ORDER.map(pid=>{
            const v = s.impact?.[pid] || "—";
            const proj = (DATA.projects||[]).find(p=>p.id===pid);
            return `<div class="impact-cell"><span class="pname">${proj?proj.name:pid}</span><span class="pval">${v}</span></div>`;
          }).join("")}
        </div>
      </div>

      ${linkedTools.length ? `
      <div class="sect">
        <h3>Инструменты (${linkedTools.length})</h3>
        <div class="tools-list">
          ${linkedTools.map(t=>`<div class="tool"><span>${t.name}</span><span class="tlang">${t.lang||""}</span></div>`).join("")}
        </div>
      </div>` : ""}

      ${renderActions(id, st, allDone)}

      <div class="meta-line">SKILL_ID: ${id}</div>
    </div>
  `;

  // wire quest click toggles
  pc.querySelectorAll(".quest").forEach(el=>{
    el.addEventListener("click", ()=>{
      const qid = el.getAttribute("data-q");
      const q = s.quests.find(x=>x.id===qid);
      const cur = questDone(id,q);
      setQuestDone(id, qid, !cur);
      recomputeAndRedraw();
      renderPanel(id);
    });
  });

  // action buttons
  pc.querySelectorAll("[data-act]").forEach(b=>{
    b.addEventListener("click", ()=> handleAction(b.getAttribute("data-act"), id));
  });
}

function renderActions(id, st, allDone){
  const s = DATA.skills[id];
  let html = `<div class="sect"><h3>Действия</h3>`;
  if(st === "LOCKED"){
    html += `<button class="btn-learn" disabled>🔒 ЗАБЛОКИРОВАНО (пререквизиты)</button>`;
  } else if(st === "AVAILABLE"){
    html += `<button class="btn-learn" data-act="learn">⚡ ИЗУЧИТЬ (выполнить все квесты)</button>`;
  } else if(st === "LEARNED"){
    const unlocksDone = s.unlocks.length===0 || s.unlocks.every(u=>currentStates[u]==="LEARNED"||currentStates[u]==="MASTERED");
    html += `<button class="btn-master" data-act="master">★ ПОВЫСИТЬ ДО MASTERED</button>`;
    if(!unlocksDone) html += `<div style="font-size:10px;margin-top:5px;opacity:.7;color:var(--amber)">Подсказка: сначала доведите до LEARNED все открываемые навыки.</div>`;
  } else { // MASTERED
    html += `<button class="btn-master" disabled style="opacity:.5">★ MASTERED ✓</button>`;
  }
  html += `<button class="btn-reset" data-act="reset">↺ СБРОСИТЬ ПРОГРЕСС НАВЫКА</button></div>`;
  return html;
}

function handleAction(act, id){
  if(act === "learn"){
    if(!userState[id]) userState[id] = {questsDone:{}, masteredOverride:false};
    userState[id].questsDone = userState[id].questsDone || {};
    DATA.skills[id].quests.forEach(q => userState[id].questsDone[q.id] = true);
    saveUserState();
    recomputeAndRedraw();
    renderPanel(id);
  } else if(act === "master"){
    if(!userState[id]) userState[id] = {questsDone:{}, masteredOverride:false};
    userState[id].masteredOverride = true;
    // also force-learn unlocks to satisfy mastery chain
    DATA.skills[id].unlocks.forEach(u=>{
      if(!userState[u]) userState[u] = {questsDone:{}, masteredOverride:false};
      userState[u].questsDone = userState[u].questsDone || {};
      DATA.skills[u].quests.forEach(q=> userState[u].questsDone[q.id] = true);
    });
    saveUserState();
    recomputeAndRedraw();
    renderPanel(id);
  } else if(act === "reset"){
    delete userState[id];
    saveUserState();
    recomputeAndRedraw();
    renderPanel(id);
  }
}

/* =========================================================
   FILTERS
   ========================================================= */
function visibleNode(n){
  if(filters.branches.size && !filters.branches.has(n.branch)) return false;
  if(filters.projects.size){
    // node impact for at least one selected project != "—"/undefined
    const ok = [...filters.projects].some(p => {
      const v = n.impact?.[p];
      return v && v !== "—";
    });
    if(!ok) return false;
  }
  if(filters.states.size && !filters.states.has(currentStates[n.id])) return false;
  return true;
}
function applyFilters(){
  if(!sim || !sim._nodeSel) return;
  const visId = new Set();
  sim._nodes.forEach(n => { if(visibleNode(n)) visId.add(n.id); });
  sim._nodeSel.style("display", n => visId.has(n.id) ? null : "none");
  sim._labelSel.style("display", n => visId.has(n.id) ? null : "none");
  sim._linkSel.style("display", l => (visId.has(l.source.id||l.source) && visId.has(l.target.id||l.target)) ? null : "none");
  sim.alpha(0.5).restart();
}

function buildPills(){
  const branches = [...new Set(Object.values(DATA.skills).map(s=>s.branch))];
  const bp = document.getElementById("branch-pills");
  bp.innerHTML = branches.map(b=>`<button class="pill" data-kind="branch" data-val="${b}">${b}</button>`).join("");

  const pp = document.getElementById("project-pills");
  pp.innerHTML = PROJECTS_ORDER.map(p=>{
    const proj = (DATA.projects||[]).find(x=>x.id===p);
    return `<button class="pill" data-kind="project" data-val="${p}">${proj?proj.name:p}</button>`;
  }).join("");

  const sp = document.getElementById("state-pills");
  sp.innerHTML = ["LOCKED","AVAILABLE","LEARNED","MASTERED"].map(s=>
    `<button class="pill" data-kind="state" data-val="${s}">${s}</button>`).join("");

  document.querySelectorAll(".pill").forEach(p=>{
    p.addEventListener("click", ()=>{
      const kind = p.getAttribute("data-kind");
      const val = p.getAttribute("data-val");
      const set = kind==="branch"?filters.branches : kind==="project"?filters.projects : filters.states;
      if(set.has(val)){ set.delete(val); p.classList.remove("active"); }
      else{ set.add(val); p.classList.add("active"); }
      applyFilters();
      updateStats();
    });
  });
}

/* =========================================================
   STATS
   ========================================================= */
function updateStats(){
  const statsEl = document.getElementById("stats");
  if(CURRENT_VIEW !== "skills" && REGISTRY){
    const all = Object.entries(REGISTRY.cards || {});
    const vis = visibleCards();
    const byStage = {};
    vis.forEach(([cid,c]) => { byStage[c.lifecycle] = (byStage[c.lifecycle] || 0) + 1; });
    statsEl.innerHTML = `
      <span>CARDS: <b>${vis.length}${vis.length !== all.length ? "/" + all.length : ""}</b></span>
      <span>DESIGN+: <b>${(byStage.DESIGN||0)+(byStage.APPROVED||0)+(byStage.BUILD||0)+(byStage.REVIEW||0)}</b></span>
      <span>VERIFY: <b>${byStage.VERIFY||0}</b></span>
      <span style="color:var(--gold)">LIVE: <b>${(byStage.LIVE||0)+(byStage.OBSERVE||0)}</b></span>
      <span>RETIRED: <b>${byStage.RETIRED||0}</b></span>
      <span>AGENTS: <b>${Object.keys(REGISTRY.agents||{}).length}</b></span>
      ${SNAPSHOT ? `<span>DRIFT: <b>${(Array.isArray(SNAPSHOT.drift_signals) ? SNAPSHOT.drift_signals : []).length}</b></span>` : ""}
    `;
    return;
  }
  if(!DATA){ statsEl.innerHTML = ""; return; }
  const ids = Object.keys(DATA.skills);
  const counts = {LOCKED:0,AVAILABLE:0,LEARNED:0,MASTERED:0};
  let totalQ=0, doneQ=0;
  ids.forEach(id=>{
    counts[currentStates[id]]++;
    const s = DATA.skills[id];
    s.quests.forEach(q=>{ totalQ++; if(questDone(id,q)) doneQ++; });
  });
  statsEl.innerHTML = `
    <span>SKILLS: <b>${ids.length}</b></span>
    <span>LOCKED: <b>${counts.LOCKED}</b></span>
    <span>AVAILABLE: <b>${counts.AVAILABLE}</b></span>
    <span>LEARNED: <b>${counts.LEARNED}</b></span>
    <span style="color:var(--gold)">MASTERED: <b>${counts.MASTERED}</b></span>
    <span>QUESTS: <b>${doneQ}/${totalQ}</b></span>
    <span>TOOLS: <b>${(DATA.tools||[]).length}</b></span>
  `;
}

/* =========================================================
   RECOMPUTE + REDRAW
   ========================================================= */
function recomputeAndRedraw(){
  currentStates = computeStates();
  // update node states + visuals without rebuilding force sim
  if(sim && sim._nodeSel){
    sim._nodes.forEach(n => n.state = currentStates[n.id]);
    const sel = sim._nodeSel;
    sel.style("color", d=>STATE_COLOR[d.state]);
    sel.select("circle:not(.pulse)").attr("stroke", d=>STATE_COLOR[d.state])
       .attr("opacity", d=>d.state==="LOCKED"?0.35:1)
       .style("filter", d => d.state==="LOCKED" ? "none" :
         (d.state==="MASTERED" ? "drop-shadow(0 0 8px #FFD700)" :
          d.state==="LEARNED" ? "drop-shadow(0 0 6px #ffb000)" :
          "drop-shadow(0 0 5px #00ff41)"));
    // manage pulse rings
    sel.selectAll("circle.pulse").remove();
    sel.filter(d=>d.state==="MASTERED").insert("circle",":first-child")
       .attr("class","pulse").attr("fill","none").attr("stroke","#FFD700")
       .attr("stroke-width",2).attr("opacity",.6);
    // links
    sim._linkSel
      .attr("stroke", d => STATE_COLOR[currentStates[d.source.id||d.source]||"LOCKED"])
      .attr("marker-end", d => "url(#arrow-"+(currentStates[d.target.id||d.target]||"LOCKED")+")");
    sim.alpha(0.4).restart();
  }
  updateStats();
  applyFilters();
}

/* =========================================================
   v5: COMMAND PALETTE / FULL-SCREEN INSPECTOR / COMPACT / EXPORT
   ========================================================= */
  const PALETTE_VIEWS = ["skills","next","proposals","matrix","kanban","deps","acceptance","tasks","projects","agents","blockers","workspace"];
  let palSel = 0, palItems = [];
  function openPalette(){
    let pal = document.getElementById("palette");
    if(!pal){
      pal = document.createElement("div");
      pal.id = "palette";
      pal.className = "palette";
      pal.innerHTML = `<div class="palette-box">
        <input class="palette-input" id="palette-input" placeholder="> действие или карточка… (Esc — закрыть)">
        <div class="palette-list" id="palette-list"></div>
      </div>`;
      document.body.appendChild(pal);
      document.getElementById("palette-input").addEventListener("input", onPaletteInput);
      document.getElementById("palette-input").addEventListener("keydown", onPaletteKey);
      pal.addEventListener("click", e=>{ if(e.target === pal) closePalette(); });
    }
    const inp = document.getElementById("palette-input");
    inp.value = "";
    pal.classList.add("open");
    renderPalette("");
    setTimeout(()=> inp.focus(), 30);
  }
  function closePalette(){ const p = document.getElementById("palette"); if(p) p.classList.remove("open"); }
  function palBase(){
    const items = PALETTE_VIEWS.map(v => ({ type:"view", label:`View: ${v.toUpperCase()}`, view:v }));
    items.unshift({ type:"view", label:"View: HUD (БОРТОВАЯ ПАНЕЛЬ v8)", view:"hud" });
    const cards = Object.entries(REGISTRY.cards || {}).map(([cid,c]) =>
      ({ type:"card", label:`${cid} — ${c.title}`, cid }));
    const projects = (SNAPSHOT && Array.isArray(SNAPSHOT.projects)) ? SNAPSHOT.projects.filter(p=>p.repo).map(p =>
      ({ type:"ws", label:`Workspace: ${p.id}`, project:p.id })) : [];
    const actions = [
      { type:"act", label:"Action: Refresh (re-fetch snapshot)", act:()=>refreshData() },
      { type:"act", label:"Action: Toggle AUTO-polling", act:()=>setPolling(!REFRESH.on) },
      { type:"act", label:"Action: Export view → Markdown", act:()=>exportView("markdown") },
      { type:"act", label:"Action: Export view → JSON", act:()=>exportView("json") },
      { type:"act", label:"Action: Toggle compact mode", act:toggleCompact },
    ];
    return [...items, ...cards, ...projects, ...actions];
  }
  function renderPalette(q){
    const list = document.getElementById("palette-list");
    const items = palBase();
    const f = q.trim().toLowerCase();
    palItems = f ? items.filter(i => i.label.toLowerCase().includes(f)) : items.slice(0, 40);
    palSel = 0;
    if(!palItems.length){ list.innerHTML = `<div class="palette-item"><span class="ph">нет совпадений</span></div>`; return; }
    list.innerHTML = palItems.map((i, idx) =>
      `<div class="palette-item ${idx===0?"sel":""}" data-pi="${idx}">
        <span>${esc(i.label)}</span><span class="ph">${i.type==="view"?"view":i.type==="card"?"card":i.type==="ws"?"workspace":"action"}</span>
      </div>`).join("");
    list.querySelectorAll("[data-pi]").forEach(el=>{
      el.addEventListener("click", ()=> { palSel = +el.getAttribute("data-pi"); palCommit(); });
    });
  }
  function onPaletteInput(e){ renderPalette(e.target.value); }
  function onPaletteKey(e){
    if(e.key === "Escape"){ closePalette(); return; }
    if(e.key === "ArrowDown"){ e.preventDefault(); palSel = Math.min(palSel+1, palItems.length-1); syncPalSel(); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); palSel = Math.max(palSel-1, 0); syncPalSel(); }
    else if(e.key === "Enter"){ e.preventDefault(); palCommit(); }
  }
  function syncPalSel(){
    const items = document.querySelectorAll("#palette-list [data-pi]");
    items.forEach((el,i)=> el.classList.toggle("sel", i===palSel));
    items[palSel] && items[palSel].scrollIntoView({ block:"nearest" });
  }
  function palCommit(){
    const it = palItems[palSel];
    if(!it) return closePalette();
    closePalette();
    if(it.type === "view") setView(it.view);
    else if(it.type === "card"){ renderCardPanel(it.cid); setView("next"); }
    else if(it.type === "ws") handleAction("workspace-open", { project: it.project });
    else if(it.act) it.act();
  }

  /* full-screen inspector */
  function openInspector(cid){
    const c = REGISTRY.cards[cid];
    if(!c) return;
    let ov = document.getElementById("inspect-ov");
    if(!ov){
      ov = document.createElement("div");
      ov.id = "inspect-ov";
      ov.className = "inspect-ov";
      ov.innerHTML = `<div class="inspect-box" id="inspect-box"></div>`;
      document.body.appendChild(ov);
      ov.addEventListener("click", e=>{ if(e.target === ov) ov.classList.remove("open"); });
    }
    const col = LIFECYCLE_COLOR[c.lifecycle] || "#666";
    document.getElementById("inspect-box").innerHTML = `
      <h2 style="color:var(--amber)">${esc(cid)} <span style="color:${col}">${esc(c.lifecycle)}</span></h2>
      <div style="margin:6px 0 12px;opacity:.85">${esc(c.title)}</div>
      ${cardBodyHtml(cid, c)}
      <div style="margin-top:14px">${projectButtons(c.project || "")} <button class="act-btn" onclick="document.getElementById('inspect-ov').classList.remove('open')">✕ Закрыть</button></div>`;
    ov.classList.add("open");
  }
  function cardBodyHtml(cid, c){
    const blocksArr = Object.entries(REGISTRY.cards || {}).filter(([ ,oc]) => (oc.depends_on||[]).includes(cid)).map(([oc])=>oc).sort();
    const ni = nextInfo(cid, c);
    const dep = (c.depends_on||[]).map(d=>`<span class="depchip" data-card="${esc(d)}">${esc(d)}</span>`).join(" ") || "—";
    const blk = blocksArr.map(b=>`<span class="depchip" data-card="${esc(b)}">${esc(b)}</span>`).join(" ") || "—";
    const art = (c.artifacts||[]).map(a=>`<div class="link-res" data-link="${esc(a)}" data-mode="nvim">${esc(a)}</div>`).join("") || "—";
    const col = LIFECYCLE_COLOR[c.lifecycle] || "#666";
    return `
      <div class="sect"><h3>Next step</h3><span class="na-dot" style="color:${col}">●</span> ${esc(ni.next)}${(ni.reasons||[]).map(r=>`<div class="bad" style="color:#ff6b6b">${esc(r)}</div>`).join("")}</div>
      <div class="sect"><h3>Контур</h3>
        <div class="row"><span class="k">Owner</span><span class="v">${esc(c.owner)}</span></div>
        <div class="row"><span class="k">Priority</span><span class="v">${esc(c.priority||"—")}</span></div>
        <div class="row"><span class="k">Project</span><span class="v">${esc(c.project||"ecosystem-wide")}</span></div>
        <div class="row"><span class="k">Depends on</span><span class="v">${dep}</span></div>
        <div class="row"><span class="k">Blocks</span><span class="v">${blk}</span></div>
      </div>
      <div class="sect"><h3>Acceptance</h3><div>${linkify(c.acceptance)}</div></div>
      <div class="sect"><h3>Evidence</h3><div style="margin-bottom:4px">${art}</div>
        ${(c.tasks||[]).map(t=>`<span class="tid">${esc(t)} ${taskSection(t)?`<span style="color:var(--amber)">[${esc(taskSection(t))}]</span>`:""}</span>`).join(" ")}</div>
      <div class="sect"><h3>Review</h3><div>${linkify(c.review)}</div></div>
      <div class="sect"><h3>Risk / Rollback</h3><div>${linkify(c.risk)}</div><div style="margin-top:4px">${linkify(c.rollback)}</div></div>
      <div class="sect"><h3>Status note</h3><div>${linkify(c.status_note)}</div></div>`;
  }

  /* compact mode */
  function toggleCompact(){
    document.body.classList.toggle("compact");
    toast(document.body.classList.contains("compact") ? "compact mode ON" : "compact mode OFF");
  }

  /* export current view */
  function exportView(fmt){
    const view = CURRENT_VIEW;
    if(view === "skills"){ toast("skills — граф, экспорт только registry"); return; }
    const raw = document.getElementById("view-wrap");
    if(!raw){ toast("нечего экспортировать"); return; }
    if(fmt === "json"){
      // структура: текущая проекция в JSON (карточки + их readyness)
      const cards = Object.fromEntries(Object.entries(REGISTRY.cards||{}).filter(([cid,c]) => cardVisible(cid,c)).map(([cid,c]) => [cid, { title:c.title, lifecycle:c.lifecycle, priority:c.priority, owner:c.owner, project:c.project, next:nextInfo(cid,c) }]));
      copyText(JSON.stringify({ view, exported_at:new Date().toISOString(), cards }, null, 2));
      toast("экспорт JSON → буфер");
      return;
    }
    // markdown: текстовое извлечение из DOM
    let md = `# Pip-Boy · ${view.toUpperCase()} · ${new Date().toISOString().slice(0,19)}\n\n`;
    const el = raw.cloneNode(true);
    el.querySelectorAll("button, .na-dot, .svc-dot").forEach(b=>b.remove());
    const text = el.innerText.replace(/\n{3,}/g, "\n\n");
    md += text.split("\n").map(l => l.trim() ? `> ${l}` : "").join("\n");
    md += `\n\n*read-only projection · canonical registry.json*`;
    copyText(md);
    toast("экспорт Markdown → буфер");
  }

/* =========================================================
   INIT
   ========================================================= */
async function init(){
  // plan v2: registry + snapshot first (views work without data.json)
  REGISTRY = await loadRegistry();
  SNAPSHOT = await loadSnapshot();
  REFRESH.last = new Date();
  updateDataBadge();
  updateRefreshInfo();
  // v6: SSE live подключение (EventSource; polling остаётся fallback)
  initLive();
  // v8/B: HUD widget registry + сохранённый layout
  hudInitWidgets();
  // v8 CENTRE: стартовая вкладка + capture-сигналы
  centreSyncCapture();
  loadHudLayout();
  // SSE-события → HUD live-фид
  HUD.feed = [];
  // v3: live refresh wiring — кнопка ⟳, AUTO-polling, клавиши R/P
  const bref = document.getElementById("btn-refresh");
  if(bref) bref.addEventListener("click", refreshData);
  const bpoll = document.getElementById("btn-poll");
  if(bpoll) bpoll.addEventListener("click", () => setPolling(!REFRESH.on));
  document.addEventListener("keydown", e => {
    const t = e.target;
    if(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")) return;
    if((e.ctrlKey || e.metaKey) && e.key === "k"){ e.preventDefault(); openPalette(); }
    else if(e.key === "r" || e.key === "R") refreshData();
    else if(e.key === "p" || e.key === "P") setPolling(!REFRESH.on);
    else if(e.key === "Escape") closePalette();
    else if(e.key === "Tab"){
      if(CURRENT_VIEW === "centre"){
        e.preventDefault();
        const r = cdReadyList(); if(!r.length) return;
        let i = r.findIndex(([cid]) => cid === CENTRE.focus);
        i = i < 0 ? 0 : (i + (e.shiftKey ? -1 : 1) + r.length) % r.length;
        cdSetFocus(r[i][0]);
      }
    } else if(e.altKey && e.key === "ArrowLeft" && CURRENT_VIEW === "centre"){ e.preventDefault(); cdHistMove(-1); }
    else if(e.altKey && e.key === "ArrowRight" && CURRENT_VIEW === "centre"){ e.preventDefault(); cdHistMove(1); }
    else if(e.key >= "1" && e.key <= "4" && CURRENT_VIEW === "centre"){
      const pid = PROJECTS_ORDER[+e.key - 1];
      const first = cdReadyList().find(([cid,c]) => c.project === pid) || Object.entries(REGISTRY.cards||{}).find(([cid,c]) => c.project === pid);
      if(first) cdSetFocus(first[0]);
    } else if(e.key === "Enter" && CURRENT_VIEW === "centre"){
      const b = document.querySelector("#cd-proposal"); if(b) b.click();
    }
  });
  // v5: глобально — открывать inspector по Shift+клик на карточку
  document.addEventListener("click", e => {
    const cardEl = e.target.closest ? e.target.closest("[data-card]") : null;
    if(cardEl && e.shiftKey){ e.preventDefault(); openInspector(cardEl.getAttribute("data-card")); }
  });
  // view switcher
  document.querySelectorAll(".view-pill").forEach(p=>{
    p.addEventListener("click", ()=> setView(p.getAttribute("data-view")));
  });
  // registry filters (Kanban control plane)
  buildRegFilters();

  // v3: deep-link на view через location.hash (#next / #deps / #kanban …)
  const applyHashView = () => {
    const hv = (location.hash || "").replace("#", "").trim();
    if(hv && document.querySelector(`.view-pill[data-view="${hv}"]`)) setView(hv);
  };
  applyHashView();

  DATA = await loadData();
  if(!DATA){
    // skills view unavailable, but registry views still work
    setView(REGISTRY ? "matrix" : "skills");
    if(!REGISTRY) return;
    document.querySelector('.view-pill[data-view="skills"]').disabled = true;
    return;
  }
  userState = loadUserState();
  currentStates = computeStates();
  initSvg();
  buildGraph();
  buildPills();
  updateStats();
  document.getElementById("center").addEventListener("click", ()=>{
    svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
    sim.force("center", d3.forceCenter(centerX(), centerY()));
    sim.alpha(0.7).restart();
  });
  document.getElementById("graph-wrap").addEventListener("click", e=>{
    if(e.target.tagName === "svg" || e.target === document.getElementById("graph-wrap")){
      clearHighlight();
      selectedId = null;
      document.getElementById("panel-empty").style.display = "block";
      document.getElementById("panel-content").style.display = "none";
    }
  });
  window.addEventListener("resize", ()=>{
    if(!sim) return;
    sim.force("center", d3.forceCenter(centerX(), centerY()));
    sim.alpha(0.3).restart();
  });
  // initial gentle layout warmup
  sim.alpha(1).restart();
}

init();
</script>
