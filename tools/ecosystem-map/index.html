<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAULT-OS :: Ecosystem Map</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
:root{
  --bg:#0b0e14; --surface:#11151d; --surface2:#161b26;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14);
  --txt:#e6e9f2; --txt-dim:#8b93a7; --txt-faint:#565e72;
  --cyan:#22d3ee; --emerald:#10b981; --amber:#f59e0b; --rose:#f43f5e; --violet:#a78bfa; --gold:#f59e0b;
  --green:#10b981; --red:#f43f5e; --grey:#565e72;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;line-height:1.45;
  font-feature-settings:"tnum" 1}
#amb{position:fixed;inset:0;z-index:0;opacity:.5}
::selection{background:rgba(34,211,238,.25)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

#app{position:relative;z-index:1;display:grid;grid-template-rows:auto auto 1fr;height:100vh}

/* HEADER */
header{padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);backdrop-filter:blur(12px);background:rgba(17,21,29,.7)}
header h1{font-size:14px;font-weight:700;letter-spacing:.3px}
header h1 b{color:var(--cyan)}
header h1 .sub{color:var(--txt-faint);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
  margin-left:8px;border:1px solid var(--line);border-radius:99px;padding:2px 8px}
.stats{display:flex;gap:16px;font-size:12px;color:var(--txt-dim)}
.stats b{color:var(--txt);font-family:var(--mono);font-size:11px;font-weight:600}
.spacer{flex:1}

/* FILTERS */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fgroup{display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);padding:5px 8px;border-radius:10px;
  background:rgba(255,255,255,.02)}
.fgroup label{color:var(--txt-faint);font-size:9px;letter-spacing:1.5px;text-transform:uppercase}
.fgroup select,.fgroup .btns{background:var(--surface2);border:1px solid var(--line);color:var(--txt);
  font-family:var(--sans);font-size:12px;padding:2px 6px;border-radius:6px}
.fgroup select:focus{outline:1px solid rgba(34,211,238,.5)}
.pills{display:flex;flex-wrap:wrap;gap:3px}
.pill{border:1px solid var(--line);color:var(--txt-dim);background:transparent;font-family:var(--sans);
  font-size:10.5px;padding:2px 8px;cursor:pointer;border-radius:99px;transition:all .12s}
.pill:hover{color:var(--txt);border-color:var(--line2);background:var(--surface)}
.pill.on{color:var(--cyan);border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.08)}
.view-pills{display:flex;gap:3px;flex-wrap:wrap}
.view-pill{border:1px solid var(--line);color:var(--txt-dim);background:transparent;font-family:var(--sans);
  font-size:11px;font-weight:550;padding:3px 11px;cursor:pointer;border-radius:99px;transition:all .13s}
.view-pill:hover{color:var(--txt);border-color:var(--line2);background:var(--surface)}
.view-pill.active{color:var(--cyan);border-color:rgba(34,211,238,.45);background:rgba(34,211,238,.08)}
.data-badge{font-size:10px;letter-spacing:.5px;padding:3px 10px;border:1px solid var(--line);
  border-radius:99px;color:var(--txt-faint);font-family:var(--mono)}
.data-badge.gen{color:var(--cyan);border-color:rgba(34,211,238,.3)}
#reg-search{background:var(--surface);border:1px solid var(--line);color:var(--txt);font-family:var(--sans);
  font-size:12px;padding:4px 10px;border-radius:8px;width:200px}
#reg-search:focus{outline:1px solid rgba(34,211,238,.4)}
#reg-search::placeholder{color:var(--txt-faint)}

/* MAIN */
main{display:grid;grid-template-columns:1fr 360px;min-height:0;overflow:hidden;grid-row:3;grid-column:1}
#graph-wrap{position:relative;overflow:hidden;background:transparent}
#graph-wrap svg{width:100%;height:100%;display:block;cursor:grab}
#graph-wrap svg:active{cursor:grabbing}
.graph-hint{position:absolute;left:12px;bottom:12px;font-size:10px;color:var(--txt-faint);pointer-events:none}
.center-btn{position:absolute;right:12px;bottom:12px;background:var(--surface);border:1px solid var(--line2);
  color:var(--txt-dim);font-family:var(--sans);font-size:11px;padding:5px 12px;cursor:pointer;border-radius:8px}
.center-btn:hover{color:var(--cyan);border-color:rgba(34,211,238,.4)}

/* TOOLTIP */
.tooltip{position:absolute;pointer-events:none;background:rgba(17,21,29,.95);backdrop-filter:blur(8px);
  border:1px solid var(--line2);color:var(--txt);padding:10px 12px;font-size:11.5px;min-width:190px;max-width:300px;
  border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.55);z-index:50;opacity:0;transition:opacity .12s}
.tooltip .tt-title{color:var(--txt);font-weight:650;margin-bottom:3px;font-size:12.5px}
.tooltip .tt-state{font-size:10px;letter-spacing:1px;font-family:var(--mono);color:var(--txt-faint)}
.tooltip .tt-whatif{margin-top:7px;border-top:1px solid var(--line);padding-top:6px;color:var(--amber)}
.tooltip .tt-whatif b{color:var(--amber)}

/* PANEL */
aside{border-left:1px solid var(--line);backdrop-filter:blur(8px);background:rgba(17,21,29,.45);
  overflow-y:auto;padding:0;min-height:0}
aside .panel-head{position:sticky;top:0;background:rgba(17,21,29,.9);border-bottom:1px solid var(--line);
  padding:12px 16px;z-index:5}
aside .panel-head h2{font-size:13px;font-weight:650;letter-spacing:.3px}
aside .panel-head .icon{font-size:24px;vertical-align:middle;margin-right:8px}
.panel-body{padding:14px 16px}
.empty{color:var(--txt-faint);font-style:italic;text-align:center;margin-top:60px;padding:0 20px}
.sect{margin-bottom:16px}
.sect h3{font-size:10px;color:var(--txt-faint);letter-spacing:1.8px;text-transform:uppercase;
  border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;padding:3px 0;font-size:12px;color:var(--txt-dim)}
.row .k{opacity:.8}
.row .v{color:var(--txt);font-family:var(--mono);font-size:11.5px}

.state-badge{display:inline-block;padding:2px 9px;border:1px solid;border-radius:99px;font-size:10px;
  letter-spacing:1px;font-weight:600;font-family:var(--mono)}
.s-LOCKED{color:var(--txt-faint);border-color:var(--line)}
.s-AVAILABLE{color:var(--emerald);border-color:rgba(16,185,129,.4)}
.s-LEARNED{color:var(--amber);border-color:rgba(245,158,11,.3)}
.s-MASTERED{color:var(--gold);border-color:rgba(245,158,11,.6)}

.btn-learn{width:100%;background:linear-gradient(180deg,rgba(34,211,238,.15),rgba(34,211,238,.05));
  border:1px solid rgba(34,211,238,.45);color:var(--cyan);font-family:var(--sans);font-size:12px;
  font-weight:600;padding:8px;cursor:pointer;border-radius:10px}
.btn-learn:disabled{opacity:.35;cursor:not-allowed}

/* view pills reuse + reg filters bar */
.reg-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 14px;
  border-bottom:1px solid var(--line);background:rgba(17,21,29,.5);backdrop-filter:blur(8px)}
.rfgroup{display:flex;flex-direction:column;gap:3px}
.rfgroup label{color:var(--txt-faint);font-size:9px;letter-spacing:1.5px;text-transform:uppercase}
#view-wrap{overflow:auto;background:transparent;padding:16px 20px;min-height:0}
#view-wrap h2.vtitle{font-size:15px;font-weight:700;letter-spacing:-.2px;margin-bottom:4px}
#view-wrap .vsub{font-size:11px;color:var(--txt-faint);margin-bottom:14px}
.no-snapshot{color:var(--txt-faint);font-style:italic;font-size:11.5px;margin:20px 0}

/* MATRIX */
table.matrix{border-collapse:collapse;width:100%;font-size:11px}
table.matrix th,table.matrix td{border:1px solid var(--line);padding:5px 8px;vertical-align:top}
table.matrix th{color:var(--txt-faint);letter-spacing:1px;font-size:10px;background:var(--surface);text-align:left}
table.matrix td.layer-cell{color:var(--amber);font-size:10px;white-space:nowrap;background:var(--surface)}
.mcard{display:block;margin:2px 0;padding:3px 8px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface);cursor:pointer;font-size:10.5px;color:var(--txt)}
.mcard:hover{border-color:rgba(34,211,238,.4)}
.mcard .mid{color:var(--cyan);margin-right:4px;font-family:var(--mono)}

/* KANBAN */
.kboard{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(180px,1fr);gap:10px;align-items:start}
.kcol{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:120px}
.kcol.empty{opacity:.4}
.kcol h4{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:7px;display:flex;justify-content:space-between}
.kcol h4 .cnt{font-family:var(--mono);color:var(--txt-faint)}
.kbody{display:flex;flex-direction:column;gap:5px;max-height:calc(100vh - 320px);overflow-y:auto}
.kcard{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 9px;font-size:11px;
  cursor:pointer;transition:all .12s}
.kcard:hover{border-color:rgba(34,211,238,.4)}
.kid{font-family:var(--mono);font-size:10px;color:var(--cyan);margin-right:4px}
.kl{font-size:9px;color:var(--txt-faint);margin-top:3px}

/* NEXT */
.na-sec{font-size:10px;color:var(--txt-faint);letter-spacing:1.8px;text-transform:uppercase;
  border-bottom:1px solid var(--line);padding-bottom:3px;margin:16px 0 8px}
.na-row{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--line);border-left:3px solid var(--line);
  border-radius:10px;background:var(--surface);padding:7px 10px;margin-bottom:5px;font-size:11.5px}
.na-row:hover{border-color:rgba(34,211,238,.3);background:var(--surface2)}
.na-row .na-id{cursor:pointer;color:var(--amber);white-space:nowrap;min-width:62px;font-family:var(--mono);font-size:11px}
.na-row .na-main{flex:1;min-width:0}
.na-row .na-reason{font-size:10.5px;color:var(--txt-dim);margin-top:2px}
.na-row .na-reason .bad{color:var(--rose)}
.na-dot{flex:none;font-size:10px;line-height:1.5}
.na-dot{color:#555}
.na-export{flex:none;background:var(--surface2);border:1px solid var(--line);color:var(--txt-dim);
  font-family:var(--sans);font-size:10px;padding:2px 8px;cursor:pointer;border-radius:8px}
.na-export:hover{border-color:rgba(34,211,238,.4);color:var(--cyan)}
.na-stat{display:inline-block;margin:2px 4px;padding:2px 10px;border:1px solid var(--line);border-radius:99px;
  font-size:10.5px;background:var(--surface);color:var(--txt-dim)}
.na-stat b{color:var(--txt);font-family:var(--mono);font-weight:600}
.depstat-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.blockers{color:var(--rose);font-size:11px;font-family:var(--mono)}

/* PROPOSALS */
.pq-item{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;background:var(--surface);
  padding:8px 12px;margin-bottom:6px}
.pq-head{display:flex;align-items:center;gap:8px;font-size:12px}
.pq-tag{flex:none;min-width:78px;text-align:center;padding:2px 6px;border-radius:99px;font-size:9px;
  letter-spacing:1px;font-weight:700;font-family:var(--mono)}
.pq-tag.approve{color:var(--emerald);border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.06)}
.pq-tag.review{color:var(--amber);border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.06)}
.pq-tag.blocked{color:var(--rose);border-color:rgba(244,63,94,.4);background:rgba(244,63,94,.06)}
.pq-tag.run{color:var(--cyan);border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.06)}
.pq-main{flex:1;min-width:0}
.pq-body{font-size:10.5px;color:var(--txt-dim);margin-top:4px;font-family:var(--mono);white-space:pre-wrap}
.pq-export{flex:none}
.pq-tag.approve{color:var(--emerald)}
.pq-tag.review{color:var(--amber)}
.pq-tag.blocked{color:var(--rose)}
.pq-tag.run{color:var(--cyan)}

/* COCKPIT + verdicts */
.cock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.cock-card{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px}
.cock-card h4{font-size:12px;font-weight:650;margin-bottom:6px}
.verdict{display:inline-block;padding:1px 8px;border:1px solid;border-radius:99px;font-size:9px;letter-spacing:1px;font-weight:700;font-family:var(--mono)}
.verdict.pass{color:var(--emerald);border-color:rgba(16,185,129,.4)}
.verdict.pending{color:var(--amber);border-color:rgba(245,158,11,.4)}
.verdict.none{color:var(--txt-faint);border-color:var(--line)}
.verdict.blocked{color:var(--rose);border-color:rgba(244,63,94,.4)}
.live-gate{font-size:10.5px;color:var(--rose);margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}

/* ACTIONS / WORKSPACE */
.act-btn{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--line);
  color:var(--txt);font-family:var(--sans);font-size:11px;padding:4px 11px;cursor:pointer;border-radius:10px;
  margin:2px 3px 2px 0;transition:all .13s}
.act-btn:hover{border-color:rgba(34,211,238,.45);color:var(--txt)}
.act-btn:disabled{opacity:.4;cursor:not-allowed}
.act-btn.primary{background:linear-gradient(180deg,rgba(34,211,238,.15),rgba(34,211,238,.05));
  border-color:rgba(34,211,238,.45);color:var(--cyan)}
.ws-launch{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
.svc-row{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;border:1px solid var(--line);
  border-radius:10px;margin-bottom:4px;font-size:11px;background:var(--surface)}
.svc-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;background:var(--txt-faint)}
.svc-dot.ok{background:var(--emerald);box-shadow:0 0 8px rgba(16,185,129,.7)}
.svc-dot.bad{background:var(--rose);box-shadow:0 0 8px rgba(244,63,94,.6)}
.link-res{color:var(--cyan);text-decoration:none;border-bottom:1px dotted rgba(34,211,238,.5);cursor:pointer}
.link-res:hover{color:var(--txt);background:rgba(34,211,238,.08)}

/* HUD v8/B widgets */
.hud-wrap{padding:12px 16px;overflow-y:auto;min-height:0}
.hud-grid{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:minmax(120px,auto);gap:10px}
.hud-w{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 12px;
  overflow:hidden;display:flex;flex-direction:column;min-height:0;transition:box-shadow .15s,border-color .15s}
.hud-w:hover{border-color:rgba(34,211,238,.25)}
.hud-w.mini{grid-column:span 3}
.hud-w.normal{grid-column:span 4}
.hud-w.wide{grid-column:span 6}
.hud-w.full{grid-column:span 12}
.hud-head{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex:none}
.hud-head .t{font-size:10px;color:var(--txt-faint);letter-spacing:1.8px;text-transform:uppercase;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-head .btn{background:transparent;border:1px solid var(--line);color:var(--txt-faint);font-family:var(--sans);
  font-size:8px;padding:1px 5px;cursor:pointer;border-radius:6px}
.hud-head .btn:hover{color:var(--txt);border-color:var(--line2)}
.hud-body{flex:1;min-height:0;overflow-y:auto;font-size:11.5px}
.hud-stat-row{display:flex;gap:6px;flex-wrap:wrap}
.hud-stat{flex:1;min-width:64px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);
  padding:8px 6px;text-align:center}
.hud-stat .n{font-size:22px;color:var(--txt);font-family:var(--mono);font-weight:700}
.hud-stat .l{font-size:8px;color:var(--txt-faint);letter-spacing:1.2px;text-transform:uppercase}
.hud-stat.ok .n{color:var(--emerald)}
.hud-stat.bad .n{color:var(--rose)}
.hud-mini-kan{display:flex;gap:4px;align-items:flex-end;height:100%}
.hud-mini-col{flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:4px;overflow:hidden}
.hud-mini-col h5{font-size:7px;color:var(--txt-faint);letter-spacing:1px;margin-bottom:3px;text-align:center;text-transform:uppercase}
.hud-mini-card{font-size:9.5px;color:var(--txt);font-family:var(--mono);border-top:2px solid var(--line);
  padding:2px 4px;margin-top:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-mini-card:hover{color:var(--cyan)}
.hud-feed{display:flex;flex-direction:column;gap:4px}
.hud-feed .fi{border-left:2px solid var(--line);padding:3px 8px;font-size:10.5px;background:var(--surface2);
  border-radius:0 8px 8px 0}
.hud-feed .fi .ts{color:var(--txt-faint);font-size:8.5px;font-family:var(--mono)}
.hud-feed .fi.updated{border-left-color:var(--cyan)}
.hud-next-item{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;
  background:var(--surface2);padding:4px 9px;margin-bottom:4px;font-size:11px;display:flex;gap:6px;
  align-items:center;cursor:pointer;font-family:var(--mono)}
.hud-next-item:hover{background:var(--surface);border-color:rgba(34,211,238,.3)}
.hud-block-item{border:1px solid rgba(244,63,94,.2);border-left:3px solid var(--rose);border-radius:10px;
  background:rgba(244,63,94,.05);padding:4px 9px;margin-bottom:4px;font-size:11px}
.hud-preset-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.hud-preset{background:transparent;border:1px solid var(--line);color:var(--txt-dim);font-family:var(--sans);
  font-size:10.5px;letter-spacing:1px;padding:3px 12px;cursor:pointer;border-radius:99px}
.hud-preset:hover{border-color:var(--line2);color:var(--txt)}
.hud-preset.active{border-color:rgba(34,211,238,.45);color:var(--cyan);background:rgba(34,211,238,.07)}

/* v8 CENTRE task-deck (внутри view-wrap) */
  .cd-grid{display:grid;grid-template-columns:250px 1fr 300px;gap:14px;min-height:0;align-items:start}
  .cd-dock{border:1px solid var(--line);border-radius:14px;background:rgba(17,21,29,.5);padding:12px}
  .cd-dsec{margin-bottom:14px}
  .cd-dsec h4{font-size:10px;color:var(--txt-faint);letter-spacing:1.8px;text-transform:uppercase;
    margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .cd-dsec h4:after{content:"";flex:1;height:1px;background:var(--line)}
  .cd-drow{display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px solid transparent;
    border-radius:10px;cursor:pointer;font-size:12px;position:relative;transition:all .12s}
  .cd-drow:hover{background:var(--surface);border-color:var(--line)}
  .cd-drow.active{background:rgba(34,211,238,.06);border-color:rgba(34,211,238,.3)}
  .cd-drow .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--txt-faint)}
  .cd-drow .dot.r{background:var(--emerald);box-shadow:0 0 10px rgba(16,185,129,.7)}
  .cd-drow .dot.y{background:var(--amber)}
  .cd-drow .dot.v{background:var(--violet)}
  .cd-drow .dot.b{background:var(--rose);box-shadow:0 0 10px rgba(244,63,94,.7)}
  .cd-drow .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt)}
  .cd-drow .cnt{font-size:10px;color:var(--txt-faint);font-family:var(--mono)}
  .dbadge{background:var(--amber);color:#000;font-size:9px;padding:1px 5px;border-radius:99px;font-weight:700}
  .cd-focus{border:1px solid var(--line2);border-radius:16px;
    background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.005));
    padding:20px 22px;transition:transform .18s ease-out}
  .cd-focus.flash{animation:cdcam .18s ease-out}
  @keyframes cdcam{0%{transform:scale(.985)}100%{transform:scale(1)}}
  .cd-focus .id{font-family:var(--mono);font-size:11px;color:var(--txt-dim)}

<script>
/* ---- v8 ambient background: точечная сетка + волна, пульс по SSE ---- */
const AMB = { pulse: 0 };
(function ambient(){
  const c = document.getElementById("amb");
  if(!c) return;
  const ctx = c.getContext("2d");
  let w, h, t = 0;
  const fit = () => { w = c.width = innerWidth; h = c.height = innerHeight; };
  fit(); addEventListener("resize", fit);
  (function frame(){
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = "rgba(255,255,255,.05)";
    for(let x = 40; x < w; x += 46){
      for(let y = 40; y < h; y += 46){
        const dx = Math.sin((x+t)/900)*6, dy = Math.cos((y+t)/1100)*5;
        ctx.fillRect(x+dx, y+dy, 1.5, 1.5);
      }
    }
    const pulse = Math.exp(-AMB.pulse * 2.2);
    for(let i = 0; i < 2; i++){
      ctx.beginPath();
      const alpha = (i === 0 ? .10 + pulse*.25 : .05);
      ctx.strokeStyle = i === 0 ? `rgba(34,211,238,${alpha})` : `rgba(167,139,250,${alpha})`;
      ctx.lineWidth = 1.2;
      for(let x = 0; x <= w; x += 8){
        const y = h - 40 - i*26
          + Math.sin(x/140 + t*(0.6+i*.25))*8
          - pulse * Math.sin(x/60 + t*2) * 26;
        x === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    if(AMB.pulse > 0) AMB.pulse = Math.max(0, AMB.pulse - 0.015);
    t += 0.02;
    requestAnimationFrame(frame);
  })();
})();

/* =========================================================
   STATE
   ========================================================= */
const PROJECTS_ORDER = ["vault","SERPlux","dotfiles","dv-hub"];
const BRANCH_COLORS = {
  VIBEOS:"#ffb000", AI:"#00ff41", CLI:"#00b4ff",
  MOBILE:"#ff00aa", WEB:"#ff7733", LANG:"#aa66ff"
};
const STATE_COLOR = {
  LOCKED:"#565e72", AVAILABLE:"#10b981", LEARNED:"#f59e0b", MASTERED:"#22d3ee"
};
  const STORE_KEY = "vaultos-ecosystem-v2";

  let DATA = null;
  let userState = {};   // skillId -> { questsDone: {qid:bool}, masteredOverride:bool }

  /* ===== plan v2: registry + snapshot + multi-view (Kanban control plane) ===== */
  let REGISTRY = null;   // canonical registry.json (committed, static)
  let SNAPSHOT = null;   // generated/snapshot.json (observer output, gitignored; may be absent)
  let CURRENT_VIEW = "skills";
  const LIFECYCLE_ORDER = ["IDEA","RESEARCH","DESIGN","APPROVED","BUILD","REVIEW","VERIFY","LIVE","OBSERVE","IMPROVE","RETIRED"];
  const LIFECYCLE_COLOR = {
    IDEA:"#565e72", RESEARCH:"#22d3ee", DESIGN:"#a78bfa", APPROVED:"#f59e0b",
    BUILD:"#f59e0b", REVIEW:"#f43f5e", VERIFY:"#10b981", LIVE:"#22d3ee",
    OBSERVE:"#22d3ee", IMPROVE:"#f59e0b", RETIRED:"#565e72"
  };
  const LAYER_ORDER = ["L0","L1","L2","L3","L4"];
  /* registry filters (Kanban control plane; read-only projection) */
  let regFilters = { layers:new Set(), facets:new Set(), projects:new Set(), owners:new Set(), priorities:new Set(), stages:new Set(), search:"" };

  async function loadRegistry(){
    try{
      const res = await fetch("registry.json", {cache:"no-store"});
      if(!res.ok) return null;
      return await res.json();
    }catch{ return null; }
  }
  async function loadSnapshot(){
    try{
      const res = await fetch("generated/snapshot.json", {cache:"no-store"});
      if(!res.ok) return null;
      return await res.json();
    }catch{ return null; }
  }

  /* ===== v3: live refresh — кнопка + polling (read-only re-fetch, no page reload) ===== */
  const REFRESH = { last:null, timer:null, pollMs:60000, on:false };
  function fmtClock(d){ return d.toTimeString().slice(0,8); }
  function snapshotDigest(){
    return (SNAPSHOT && SNAPSHOT.meta && SNAPSHOT.meta.input_digest) ? SNAPSHOT.meta.input_digest.slice(0,12) : "—";
  }
  function snapshotHead(){
    return (SNAPSHOT && SNAPSHOT.git && SNAPSHOT.git.head) ? SNAPSHOT.git.head : "";
  }
  function updateDataBadge(){
    const badge = document.getElementById("data-badge");
    if(!badge) return;
    if(SNAPSHOT){
      badge.textContent = "STATIC REGISTRY + GENERATED SNAPSHOT · READ-ONLY · POLLING: " + (REFRESH.on ? "60s" : "НЕТ");
      badge.classList.add("gen");
      badge.title = "snapshot digest " + snapshotDigest() + " @ HEAD " + snapshotHead().slice(0,10) + " — детерминированный read-only снимок, не real-time";
    } else {
      badge.textContent = "STATIC REGISTRY · READ-ONLY · SNAPSHOT: НЕТ";
      badge.title = "generated/snapshot.json не найден — запусти python3 tools/ecosystem-map/observer.py";
    }
  }
  function updateRefreshInfo(){
    const el = document.getElementById("refresh-info");
    if(!el) return;
    if(!REGISTRY){
      el.textContent = "DOWN · pipboy.py up";
      el.title = "registry.json недоступен — подними хост: python3 tools/ecosystem-map/pipboy.py up (или python3 -m http.server в tools/ecosystem-map/)";
      return;
    }
    const head = snapshotHead().slice(0,7) || "—";
    const drift = (SNAPSHOT && Array.isArray(SNAPSHOT.drift_signals)) ? SNAPSHOT.drift_signals.length : 0;
    const t = REFRESH.last ? fmtClock(REFRESH.last) : "—";
    el.textContent = "READ " + t + " · HEAD " + head + " · DRIFT " + drift;
    el.title = "refresh = re-fetch registry.json + snapshot.json · кнопка ⟳ / клавиша R · AUTO / клавиша P";
  }
  async function refreshData(){
    const [reg, snap] = await Promise.all([loadRegistry(), loadSnapshot()]);
    if(reg) REGISTRY = reg;
    if(snap) SNAPSHOT = snap;
    REFRESH.last = new Date();
    updateDataBadge();
    updateRefreshInfo();
    if(CURRENT_VIEW !== "skills") renderView(CURRENT_VIEW);
    updateStats();
    // v8/B: refresh также фиксируется в live-фиде HUD
    hudFeedPush("данные обновлены (registry+snapshot)", "refresh");
  }
  function setPolling(on){
    REFRESH.on = !!on;
    if(REFRESH.timer){ clearInterval(REFRESH.timer); REFRESH.timer = null; }
    if(REFRESH.on) REFRESH.timer = setInterval(refreshData, REFRESH.pollMs);
    const b = document.getElementById("btn-poll");
    if(b){ b.textContent = REFRESH.on ? "AUTO: 60s" : "AUTO: OFF"; b.classList.toggle("active", REFRESH.on); }
    updateDataBadge();
  }
  function badgeLivelink(){
    // upgrade бейджа при live-соединении: POLLING → SSE LIVE
    if(LIVE.on && typeof LIVE.reconnectCount === "number"){
      const badge = document.getElementById("data-badge");
      if(badge) badge.textContent = "STATIC REGISTRY + GENERATED SNAPSHOT · READ-ONLY · SSE LIVE · reconnects:" + LIVE.reconnectCount;
    }
  }
  /* ===== v6: SSE live (T-128/ECO-018) — EventSource + polling fallback ===== */
  const LIVE = { on:false, es:null, reconnectCount:0 };
  function initLive(){
    if(typeof EventSource === "undefined"){ return; } // не-браузерное окружение
    try{
      const es = new EventSource("/event");
      LIVE.es = es;
      es.addEventListener("file.watcher.updated", e => {
        if(!LIVE.on){ LIVE.on = true; badgeLivelink(); }
        try{
          const d = JSON.parse(e.data);
          toast("🔄 файлы изменились (digest " + (d.digest||"").slice(0,8) + ") — обновляю");
          hudFeedPush("файлы изменились · digest " + (d.digest||"").slice(0,8), "file.watcher.updated");
          AMB.pulse = 1;
          refreshData();
        }catch(err){ refreshData(); }
      });
      es.onopen = () => {
        LIVE.on = true;
        badgeLivelink();
        hudFeedPush("SSE live подключено", "open");
      };
      es.onerror = () => {
        // EventSource автопереподключается; считаем попытки
        LIVE.reconnectCount = (LIVE.reconnectCount || 0) + 1;
        LIVE.on = false;
        updateDataBadge();
      };
    }catch(e){ /* no-op: polling остаётся fallback */ }
  }
  function stopLive(){
    if(LIVE.es){ LIVE.es.close(); LIVE.es = null; }
    LIVE.on = false;
  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  /* ===== registry filter logic ===== */
  function cardVisible(cid, c){
    if(regFilters.layers.size && !regFilters.layers.has(c.layer)) return false;
    if(regFilters.facets.size){
      const fs = c.facets || [];
      if(![...regFilters.facets].some(f => fs.includes(f))) return false;
    }
    if(regFilters.projects.size && !regFilters.projects.has(c.project || "—")) return false;
    if(regFilters.owners.size && !regFilters.owners.has(c.owner)) return false;
    if(regFilters.priorities.size && !regFilters.priorities.has(c.priority || "—")) return false;
    if(regFilters.stages.size && !regFilters.stages.has(c.lifecycle)) return false;
    if(regFilters.search){
      const q = regFilters.search.toLowerCase();
      const hay = [cid, c.title, c.owner, c.lifecycle, c.layer, c.project || "", (c.facets||[]).join(" "), c.priority || "", c.status_note || ""].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }
  function visibleCards(){
    return Object.entries(REGISTRY.cards || {}).filter(([cid,c]) => cardVisible(cid, c));
  }
  function anyRegFilter(){
    return !!(regFilters.layers.size || regFilters.facets.size || regFilters.projects.size ||
      regFilters.owners.size || regFilters.priorities.size || regFilters.stages.size || regFilters.search);
  }
  function sortedVisible(){
    return visibleCards().sort((a,b) =>
      (LAYER_ORDER.indexOf(a[1].layer) - LAYER_ORDER.indexOf(b[1].layer)) || (a[0] < b[0] ? -1 : 1));
  }
  function taskSection(tid){
    if(!SNAPSHOT || !SNAPSHOT.tasks) return "";
    for(const sec of ["Active","Blocked","Planned","Backlog","Done"]){
      if((SNAPSHOT.tasks[sec] || []).includes(tid)) return sec;
    }
    return "";
  }
  function cardsByTask(){
    const m = {};
    for(const [cid, c] of Object.entries(REGISTRY.cards || {})){
      for(const t of (c.tasks || [])) (m[t] = m[t] || []).push(cid);
    }
    return m;
  }

  /* ===== v3: next-action readiness engine (read-only; переходы — только через librarian/approval) ===== */
  function stageRank(s){ return LIFECYCLE_ORDER.indexOf(s); }
  function priRank(p){ return (REGISTRY.priorities && REGISTRY.priorities.indexOf(p) >= 0) ? REGISTRY.priorities.indexOf(p) : 9; }
  function frozenTasks(c){
    return (c.tasks || []).filter(t => taskSection(t) === "Blocked");
  }
  /* Зависимость в DESIGN не блокирует research (план v2), но блокирует BUILD:
     IDEA/RESEARCH карточке достаточно не-RETIRED зависимости;
     DESIGN — зависимость >= DESIGN; APPROVED+ — зависимость >= APPROVED. */
  function depNeededStage(card){
    const st = card.lifecycle;
    if(st === "IDEA" || st === "RESEARCH") return 0;
    if(st === "DESIGN") return stageRank("DESIGN");
    return stageRank("APPROVED");
  }
  function depState(c){
    const need = depNeededStage(c);
    const bad = [];
    for(const d of (c.depends_on || [])){
      const dc = (REGISTRY.cards || {})[d];
      if(!dc){ bad.push({id:d, why:"нет в registry"}); continue; }
      if(dc.lifecycle === "RETIRED" || dc.retired){ bad.push({id:d, why:"RETIRED"}); continue; }
      if(stageRank(dc.lifecycle) < need) bad.push({id:d, why:dc.lifecycle});
    }
    return { ok: bad.length === 0, bad };
  }
  function unreadyChain(cid){
    const out = new Map();
    const seen = new Set();
    const stack = [...((REGISTRY.cards[cid] || {}).depends_on || [])];
    while(stack.length){
      const d = stack.pop();
      if(seen.has(d)) continue;
      seen.add(d);
      const dc = (REGISTRY.cards || {})[d];
      if(!dc){ out.set(d, "нет в registry"); continue; }
      if(dc.lifecycle === "RETIRED" || dc.retired){ out.set(d, "RETIRED"); continue; }
      if(stageRank(dc.lifecycle) < depNeededStage(REGISTRY.cards[cid])) out.set(d, dc.lifecycle);
      (dc.depends_on || []).forEach(x => stack.push(x));
    }
    return [...out.entries()].map(([id, why]) => `${id} (${why})`);
  }
  function noteBlocked(c){ return /BLOCKED/i.test(c.status_note || ""); }
  /* runtime evidence: для VERIFY→LIVE нужны выполненные задачи или артефакты
     плюс независимый verifier PASS; self-PASS не считается */
  function runtimeEvidence(c){
    const doneTasks = (c.tasks || []).filter(t => taskSection(t) === "Done");
    const hasArtifacts = (c.artifacts || []).length > 0;
    const verifier = /verifier.*(PASS|PASSED)|PASS.*(verifier|acceptance)/i.test(c.status_note || "");
    return verifier && (doneTasks.length > 0 || hasArtifacts);
  }
  /* мемоизация nextInfo: кэш по cid с отпечатком всех входов, что реально
     читает вычисление (поля карточки + стадии её прямых зависимостей из
     REGISTRY + секции задач из snapshot). Правка любого входа меняет отпечаток
     -> пересчёт; иначе результат берётся из кэша. */
  const _niCache = new Map();
  function _niFingerprint(cid, c){
    const deps = (c.depends_on || []).map(d => {
      const dc = (REGISTRY.cards || {})[d];
      return dc ? `${d}:${dc.lifecycle}${dc.retired ? "r" : ""}` : `${d}:?`;
    }).join(",");
    const parts = [
      snapshotDigest(),
      c.retired ? "1" : "0",
      c.lifecycle,
      deps,
      (c.tasks || []).join(","),
      noteBlocked(c) ? "b" : "",
    ];
    return parts.join("|");
  }
  function nextInfo(cid, c){
    const fp = _niFingerprint(cid, c);
    const hit = _niCache.get(cid);
    if(hit && hit.fp === fp) return hit.val;
    const res = nextInfoUncached(cid, c);
    _niCache.set(cid, { fp, val: res });
    return res;
  }
  function nextInfoUncached(cid, c){
    if(c.retired || c.lifecycle === "RETIRED")
      return { state:"done", reasons:[], next:"— (retired)", proposal:null };
    const bad = depState(c);
    const blockReasons = [];
    if(!bad.ok) blockReasons.push("⛔ deps: " + bad.bad.map(b => `${b.id} (${b.why})`).join(", "));
    frozenTasks(c).forEach(t => blockReasons.push(`⛔ frozen: ${t} (Blocked/Frozen в TASKS)`));
    if(noteBlocked(c)) blockReasons.push("⛔ status_note: implementation BLOCKED");
    const blocked = blockReasons.length > 0;
    switch(c.lifecycle){
      case "LIVE": case "OBSERVE": case "IMPROVE":
        return { state:"done", reasons:[], next:"эксплуатация", proposal:null };
      case "VERIFY":
        if(blocked) return { state:"blocked", reasons:blockReasons, next:"устранить блокеры → verifier acceptance", proposal:null };
        return { state:"verify",
          reasons:blockReasons,
          next:"verifier acceptance → LIVE (runtime evidence обязательны)",
          proposal:`Verify ${cid}: VERIFY → LIVE\nReason: runtime evidence + независимый verifier acceptance required\nApproval required` };
      case "REVIEW":
        if(blocked) return { state:"blocked", reasons:blockReasons, next:"устранить блокеры → VERIFY", proposal:null };
        return { state:"flight",
          reasons:blockReasons,
          next:"review → VERIFY",
          proposal:`Move ${cid}: REVIEW → VERIFY\nReason: review complete${bad.ok ? ", dependencies satisfied" : ""}\nApproval required` };
      case "BUILD":
        if(blocked) return { state:"blocked", reasons:blockReasons, next:"устранить блокеры → REVIEW", proposal:null };
        return { state:"flight", reasons:blockReasons, next:"build → REVIEW", proposal:null };
      case "APPROVED":
        if(blocked) return { state:"blocked", reasons:blockReasons, next:"устранить блокеры → BUILD", proposal:null };
        return { state:"ready", reasons:["approved, dependencies satisfied"], next:"BUILD",
          proposal:`Move ${cid}: APPROVED → BUILD\nReason: approved, dependencies satisfied\nApproval required` };
      case "DESIGN":
        if(blocked) return { state:"blocked", reasons:blockReasons, next:"устранить блокеры → APPROVED", proposal:null };
        return { state:"ready", reasons:["design ready, dependencies satisfied"], next:"APPROVED",
          proposal:`Move ${cid}: DESIGN → APPROVED\nReason: dependencies satisfied\nApproval required` };
      default: /* IDEA, RESEARCH */
        if(blocked) return { state:"blocked", reasons:blockReasons, next:"устранить блокеры", proposal:null };
        return { state:"ready", reasons:["no blocking dependencies"],
          next: c.lifecycle === "IDEA" ? "RESEARCH" : "DESIGN",
          proposal:`Start ${cid}: ${c.lifecycle} → ${c.lifecycle === "IDEA" ? "RESEARCH" : "DESIGN"}\nReason: no blocking dependencies\nApproval required` };
    }
  }
  function blocksTransitively(){
    const dependentsOf = {};
    for(const [cid, c] of Object.entries(REGISTRY.cards || {})){
      for(const d of (c.depends_on || [])) (dependentsOf[d] = dependentsOf[d] || []).push(cid);
    }
    const visit = start => {
      const seen = new Set();
      const stack = [...(dependentsOf[start] || [])];
      while(stack.length){
        const x = stack.pop();
        if(seen.has(x)) continue;
        seen.add(x);
        (dependentsOf[x] || []).forEach(y => stack.push(y));
      }
      return seen;
    };
    const res = {};
    for(const [cid, c] of Object.entries(REGISTRY.cards || {})){
      if(c.retired || c.lifecycle === "RETIRED") continue;
      if(stageRank(c.lifecycle) > stageRank("DESIGN") && !noteBlocked(c)) continue;
      res[cid] = visit(cid);
    }
    return res;
  }
  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    } else fallbackCopy(text);
  }
  function fallbackCopy(text){
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    ta.remove();
  }
  function toast(msg, ms){
    let t = document.getElementById("toast");
    if(!t){
      t = document.createElement("div");
      t.id = "toast";
      t.className = "toast";
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._h);
    t._h = setTimeout(()=> t.classList.remove("show"), ms || 2600);
  }

  /* ===== v5: server actions (workspace-open / workspace-status / link-open) ===== */
  async function callAction(op, params){
    const q = new URLSearchParams({ op, ...params });
    try{
      const res = await fetch("/action?" + q.toString(), { cache:"no-store" });
      const data = await res.json();
      return data;
    }catch(e){
      return { ok:false, error: "actions недоступны (хост не поднимает /action?): " + e.message };
    }
  }
  function actBtn(label, op, params, opts){
    const cls = (opts && opts.primary) ? "act-btn primary" : "act-btn";
    const title = (opts && opts.title) || "";
    return `<button class="${cls}" data-act="${esc(op)}" data-params="${esc(JSON.stringify(params||{}))}" title="${esc(title)}">${label}</button>`;
  }
  async function handleAction(op, params, el){
    if(el){ el.disabled = true; const o = el.textContent; el.textContent = "…"+o; }
    const data = await callAction(op, params);
    if(el){ el.disabled = false; }
    if(!data || !data.ok){
      toast((data && data.error) ? "✗ " + data.error : "✗ действие не выполнено");
      return;
    }
    if(op === "workspace-open"){
      toast(data.detached ? `▸ workspace ${data.session} (окна: ${(data.windows||[]).join(", ")})` : `▸ ${data.session}: ${(data.windows||[]).length} окон`);
    } else if(op === "link-open"){
      toast(`▸ открыл ${data.mode}: ${(data.opened||"").split("/").slice(-2).join("/")}`);
    } else {
      toast("✓ " + JSON.stringify(data).slice(0, 80));
    }
  }
  function wireActions(root){
    if(!root) root = document;
    root.querySelectorAll("[data-act]").forEach(b=>{
      b.addEventListener("click", e=>{
        e.stopPropagation();
        const op = b.getAttribute("data-act");
        const params = JSON.parse(b.getAttribute("data-params") || "{}");
        handleAction(op, params, b);
      });
    });
    // link resolver: клик по .link-res
    root.querySelectorAll(".link-res").forEach(a=>{
      a.addEventListener("click", e=>{
        e.stopPropagation();
        const target = a.getAttribute("data-link") || a.textContent;
        const mode = a.getAttribute("data-mode") || "browser";
        handleAction("link-open", { target, mode }, a);
      });
    });
  }

  /* ===== v5: workspace launcher + localhost/docker panel helpers ===== */
  const KNOWN_PORTS = {
    "SERPlux": [{ port:8000, label:"API" }, { port:5173, label:"preview" }],
    "vault": [{ port:8123, label:"pip-boy" }],
  };
  function projectButtons(projectId){
    if(!projectId) return "";
    return `<div class="ws-launch">
      ${actBtn("⚡ WORKSPACE", "workspace-open", { project: projectId }, { primary:true, title:"Открыть tmux-сессию pb-"+projectId+" (main/files/tests/logs/local)" })}
      ${actBtn("☑ STATUS", "workspace-status", { project: projectId }, { title:"Порты / docker / окна tmux" })}
      ${actBtn("▤ DIR", "link-open", { target: "[[03-Projects/"+projectId+"]]", mode:"nvim" }, { title:"Карточка проекта в Neovim" })}
    </div>`;
  }
  function syncWorkspaceStatus(){
    // после отрисовки WORKSPACE: тянем статусы проектов и заполняем placeholder'ы
    document.querySelectorAll("[data-ws-status]").forEach(async el=>{
      const project = el.getAttribute("data-ws-status");
      const data = await callAction("workspace-status", { project });
      if(!data || !data.ok){ el.innerHTML = `<span class="dim">нет данных</span>`; return; }
      const ports = (data.ports || []).map(p =>
        `<div class="svc-row"><span><span class="svc-dot ${p.healthy ? "ok" : "bad"}"></span>${esc(p.label || p.port)} :${esc(p.port)}</span><span class="dim">${p.healthy ? "up" : "down"}</span></div>`
      ).join("");
      const dock = (data.docker && data.docker.length)
        ? `<div class="svc-row"><span><span class="svc-dot ok"></span>docker</span><span class="dim">${data.docker.length} контейнер</span></div>` + data.docker.map(c=>`<div class="svc-row"><span class="dim">${esc(c)}</span></div>`).join("")
        : `<div class="svc-row"><span><span class="svc-dot"></span>docker</span><span class="dim">${data.docker_enabled ? "нет контейнеров" : "off (PIPBOY_DOCKER=1 включает)"}</span></div>`;
      el.innerHTML = `
        <div style="margin-top:5px"><b style="color:var(--amber);font-size:10px">SESSION:</b> ${esc(data.session)} ${data.tmux_running ? '<span class="verdict pass">RUNNING</span>' : '<span class="verdict none">DOWN</span>'}${data.windows.length ? " · окна: "+esc(data.windows.join(", ")) : ""}</div>
        <div style="margin-top:5px"><b style="color:var(--amber);font-size:10px">PORTS:</b>${ports || '<span class="dim"> не задано</span>'}</div>
        <div style="margin-top:5px"><b style="color:var(--amber);font-size:10px">DOCKER:</b>${dock}</div>`;
    });
  }
  function naDot(state){
    const col = { ready:"#00ff41", flight:"#ffb000", verify:"#00b4ff", blocked:"#ff6b6b", done:"#555" }[state] || "#555";
    return `<span class="na-dot" style="color:${col}">●</span>`;
  }
  /* v5: linkify [[wikilink]]/[[путь.md]] в кликабельные .link-res (link resolver) */
  function linkify(text){
    if(text == null) return "";
    const s = String(text);
    const re = /\[\[([^\]]+)\]\]/g;
    let last = 0, m;
    let out = "";
    while((m = re.exec(s)) !== null){
      out += esc(s.slice(last, m.index));
      out += `<span class="link-res" data-link="[[${esc(m[1])}]]" title="link resolver: nvim/browser/tmux">[[${esc(m[1])}]]</span>`;
      last = m.index + m[0].length;
    }
    out += esc(s.slice(last));
    return out;
  }
  function naRow(cid, c, info){
    const col = LIFECYCLE_COLOR[c.lifecycle] || "#666";
    const reasonHtml = (info.reasons || []).map(r => `<span class="${r.indexOf("⛔") === 0 ? "bad" : ""}">${esc(r)}</span>`).join(" · ");
    const chain = info.state === "blocked" ? unreadyChain(cid) : [];
    return `<div class="na-row" style="border-left-color:${col}">
      ${naDot(info.state)}
      <span class="na-id" data-card="${esc(cid)}" title="${esc(c.title)}">${esc(cid)} <span style="opacity:.6;font-size:9px">${esc(c.lifecycle)}</span></span>
      <div class="na-main">
        <div>${esc(c.title)} ${c.priority ? `<span class="chip" style="color:${col};border-color:${col}">${esc(c.priority)}</span>` : ""}${c.project ? `<span class="chip" style="color:var(--amber);border-color:var(--amber)">${esc(c.project)}</span>` : ""}</div>
        <div class="na-reason">next: ${esc(info.next)}${reasonHtml ? " · " + reasonHtml : ""}${chain.length ? `<br><span class="bad">по цепочке: ${esc(chain.join(" ← "))}</span>` : ""}</div>
      </div>
      ${info.proposal ? `<button class="na-export" data-proposal="${esc(info.proposal)}" title="Скопировать proposal в буфер (read-only; переход — только через librarian/approval)">⧉ PROPOSAL</button>` : ""}
    </div>`;
  }
  function naSort(a, b){
    return (priRank(a[1].priority) - priRank(b[1].priority)) || (a[0] < b[0] ? -1 : 1);
  }
  function renderNextAction(){
    const all = Object.entries(REGISTRY.cards || {});
    const vis = all.filter(([cid,c]) => cardVisible(cid, c));
    const filtered = vis.length !== all.length;
    const infos = vis.map(([cid, c]) => [cid, c, nextInfo(cid, c)]);
    const cnt = s => infos.filter(([, , i]) => i.state === s).length;
    const pick = s => infos.filter(([, , i]) => i.state === s).sort(naSort);
    let html = `<h2 class="vtitle">NEXT ACTION :: ЧТО МОЖНО ДЕЛАТЬ СЕЙЧАС${filtered ? ` · FILTERED ${vis.length}/${all.length}` : ""}</h2>
      <div class="vsub">readiness-движок поверх canonical registry + TASKS snapshot · порядок: priority → id · ⛔ = deps/frozen/BLOCKED · PROPOSAL = экспорт текста перехода в буфер (read-only; применение — только через librarian/approval, no silent mutation)</div>
      <div class="depstat-row">
        <span class="na-stat">READY <b>${cnt("ready")}</b></span>
        <span class="na-stat">IN FLIGHT <b>${cnt("flight")}</b></span>
        <span class="na-stat">AWAIT VERIFIER <b>${cnt("verify")}</b></span>
        <span class="na-stat">BLOCKED <b>${cnt("blocked")}</b></span>
        <span class="na-stat">DONE/LIVE <b>${cnt("done")}</b></span>
      </div>`;
    html += `<div class="na-sec">▶ READY — СТАРТ СЕЙЧАС (${cnt("ready")})</div>`;
    html += pick("ready").map(([cid, c, i]) => naRow(cid, c, i)).join("") || '<div class="no-snapshot">— нет готовых к старту карточек —</div>';
    html += `<div class="na-sec">◐ IN FLIGHT (${cnt("flight")})</div>`;
    html += pick("flight").map(([cid, c, i]) => naRow(cid, c, i)).join("") || '<div class="no-snapshot">— пусто —</div>';
    html += `<div class="na-sec">◔ AWAITING VERIFICATION (${cnt("verify")})</div>`;
    html += pick("verify").map(([cid, c, i]) => naRow(cid, c, i)).join("") || '<div class="no-snapshot">— пусто —</div>';
    html += `<div class="na-sec">⛔ BLOCKED — ЧТО БЛОКИРУЕТ ПРОГРЕСС (${cnt("blocked")})</div>`;
    html += pick("blocked").map(([cid, c, i]) => naRow(cid, c, i)).join("") || '<div class="no-snapshot">— заблокированных нет —</div>';
    /* критические блокеры: кто транзитивно держит больше всего карточек */
    const trans = blocksTransitively();
    const ranked = Object.entries(trans).map(([cid, set]) => ({cid, n: set.size})).filter(x => x.n > 0).sort((a,b) => (b.n - a.n) || (a.cid < b.cid ? -1 : 1)).slice(0, 8);
    const frozenByTask = {};
    for(const [cid, c] of vis){ for(const t of frozenTasks(c)) (frozenByTask[t] = frozenByTask[t] || []).push(cid); }
    html += `<div class="na-sec">✸ CRITICAL BLOCKERS — RANKED ПО ЧИСЛУ ЗАВИСИМЫХ</div>`;
    if(ranked.length || Object.keys(frozenByTask).length){
      html += ranked.map(x => {
        const c = REGISTRY.cards[x.cid];
        const col = LIFECYCLE_COLOR[c.lifecycle] || "#666";
        const targets = [...trans[x.cid]].sort();
        return `<div class="na-row" style="border-left-color:${col}">
          ${naDot("blocked")}
          <span class="na-id" data-card="${esc(x.cid)}">${esc(x.cid)} <span style="opacity:.6;font-size:9px">${esc(c.lifecycle)}</span></span>
          <div class="na-main">
            <div>${esc(c.title)}</div>
            <div class="na-reason"><span class="bad">держит транзитивно ${x.n}</span> · ${targets.map(t => `<span class="depchip" data-card="${esc(t)}">${esc(t)}</span>`).join(" ")}</div>
          </div>
        </div>`;
      }).join("");
      html += Object.entries(frozenByTask).map(([t, cards]) => `<div class="na-row" style="border-left-color:#ff6b6b">
          ${naDot("blocked")}
          <span class="na-id">${esc(t)}</span>
          <div class="na-main">
            <div>⛔ задача в Blocked/Frozen (TASKS.md)</div>
            <div class="na-reason">держит карточки: ${cards.map(c2 => `<span class="depchip" data-card="${esc(c2)}">${esc(c2)}</span>`).join(" ")}</div>
          </div>
        </div>`).join("");
    } else {
      html += '<div class="no-snapshot">— критических блокеров нет —</div>';
    }
    html += `<div class="ro-note">READ-ONLY · no silent mutation · источник: registry.json + generated/snapshot.json · переходы — через librarian-контур с approval пользователя</div>`;
    return html;
  }

  /* ===== v3: proposal queue — что система предлагает (без silent-применения) ===== */
  function pqTag(kind){
    const cls = { approve:"approve", review:"review", blocked:"blocked", run:"run" }[kind] || "review";
    const label = { approve:"APPROVE", review:"REVIEW", blocked:"BLOCKED", run:"RUN" }[kind] || "REVIEW";
    return `<span class="pq-tag ${cls}">${label}</span>`;
  }
  function buildProposals(){
    const out = [];
    const cards = Object.entries(REGISTRY.cards || {});
    for(const [cid, c] of cards){
      if(!cardVisible(cid, c)) continue;
      const ni = nextInfo(cid, c);
      if(ni.state === "blocked"){
        // [BLOCKED] — ждёт внешнего решения
        out.push({ kind:"blocked", cid, c, title:c.title, line:`${cid}: ${c.title}`,
          body:`${cid} заблокирована${(ni.reasons||[]).map(r=>"\n  - "+r).join("")}\nДействие: librarian/approval + разблокировать путь` });
      } else if(ni.state === "verify"){
        out.push({ kind:"approve", cid, c, title:c.title, line:`Проверить ${cid}: VERIFY → LIVE`,
          body:`${cid}: ${c.title}\nNeeds: runtime evidence + независимый verifier acceptance\nApproval required` });
      } else if(ni.state === "ready"){
        // READY — предложение к переходу
        out.push({ kind:"approve", cid, c, title:c.title, line:`Перевести ${cid} в следующий stage`,
          body:(ni.proposal || (`${cid} → следующий stage`)) + `\nReason: dependencies satisfied\nApproval required` });
      }
    }
    // drift signals -> [REVIEW]
    if(SNAPSHOT && Array.isArray(SNAPSHOT.drift_signals)){
      for(const s of SNAPSHOT.drift_signals){
        out.push({ kind:"review", cid:s.subject && /^ECO-\d+$/.test(s.subject) ? s.subject : null,
          c:null, title:s.subject, line:`Проверить drift: ${s.subject} (${s.type})`,
          body:`drift signal\nтип: ${s.type}\nsubject: ${s.subject}\n${s.detail}` });
      }
    }
    // workspace launcher [RUN] — проекты с repo и статусом
    if(SNAPSHOT && Array.isArray(SNAPSHOT.projects)){
      for(const p of SNAPSHOT.projects){
        if(p.repo && p.id !== "vault"){

  /* ===== v8/B: HUD — БОРТОВАЯ ПАНЕЛЬ (widget grid, layout as data) ===== */
  const HUD = {

  function hudReg(id, title, size, render){

  function loadHudLayout(){

  function hudResize(id){
    const order = ["mini","normal","wide","full"];
    const w = HUD.widgets[id];
    const li = HUD.layout.find(x => x.id === id);

  /* --- виджеты --- */
  function wSummary(){

    const ready = cards.filter(c => !c.retired && c.lifecycle !== "RETIRED" && ["APPROVED","DESIGN","RESEARCH","IDEA"].includes(c.lifecycle)).length;
    const verify = by.VERIFY || 0;

    return `<div class="hud-stat-row">
      ${stat("CARDS", cards.length)}
      ${stat("READY", ready, "ok")}
      ${stat("VERIFY", verify)}
      ${stat("BLOCKED", blocked, blocked ? "bad" : "")}
      ${stat("DRIFT", drift, drift ? "bad" : "")}
    </div>`;
  }
  function wNext(){
    const cards = Object.entries(REGISTRY.cards || {})

  function wDeps(){
    // мини-карта критического пути (топ-5 по числу держащих)
    const blocks = {};
    for(const [cid,c] of Object.entries(REGISTRY.cards||{})){
      for(const d of (c.depends_on||[])) (blocks[d] = blocks[d]||[]).push(cid);
    }
    const cards = Object.entries(REGISTRY.cards || {}).filter(([cid,c]) => !(c.retired||c.lifecycle==="RETIRED"));
    const holds = cards.map(([cid,c]) => {
      const seen = new Set();
      const stack = [...(blocks[cid]||[])];
      while(stack.length){
        const x = stack.pop();
        if(seen.has(x)) continue;
        seen.add(x);
        (blocks[x]||[]).forEach(y => stack.push(y));
      }
      return {cid, n: seen.size, life: c.lifecycle};
    }).filter(x => x.n > 0).sort((a,b) => b.n - a.n).slice(0, 5);
    return holds.map(h => {
      const col = LIFECYCLE_COLOR[h.life] || "#666";

  function cdDotFor(cards){ return cdDot(cards); }
  function cdDot(cards){
    const rel = cards.map(([cid,c]) => nextInfo(cid,c)).filter(x => x.state !== "done");
    if(!cards.length) return "";
    if(rel.some(x => x.state === "blocked")) return "b";
    if(rel.some(x => x.state === "verify")) return "v";
    if(rel.some(x => x.state === "ready")) return "r";
    return "y";
  }
  function cdReadyCards(){ return cdReadyList(); }
  function cdReadyList(){
    return Object.entries(REGISTRY.cards || {})

      .sort(naSort);

  function cdSetFocus(cid, push = true){
    if(!cid || !REGISTRY.cards[cid]) return;
    CENTRE.focus = cid;
    if(push){ CENTRE.hist = CENTRE.hist.slice(0, CENTRE.hidx+1); CENTRE.hist.push(cid); CENTRE.hidx = CENTRE.hist.length-1; }

  function centreProposal(cid, c){
    const ni = nextInfo(cid, c);
    const from = c.lifecycle;
    if(ni.state === "ready"){
      const to = {IDEA:"RESEARCH",RESEARCH:"DESIGN",DESIGN:"APPROVED",APPROVED:"BUILD"}[from];
      if(to) return `Move ${cid}: ${from} → ${to}\nReason: dependencies satisfied\nApproval required`;
      return `Verify ${cid}: ${from}\nApproval required`;
    }
    if(ni.state === "verify") return `Verify ${cid}: VERIFY → LIVE\nReason: runtime evidence + независимый verifier acceptance\nApproval required`;
    return null;
  }
  function centreHolds(cid){
    const blocks = {};
    for(const [x,c] of Object.entries(REGISTRY.cards || {})) for(const d of (c.depends_on||[])) (blocks[d]=blocks[d]||[]).push(x);
    const seen = new Set(); const stack = [...(blocks[cid]||[])];
    while(stack.length){ const x = stack.pop(); if(seen.has(x)) continue; seen.add(x); (blocks[x]||[]).forEach(y=>stack.push(y)); }
    return seen.size;
  }

  function findCycles(){
    const color = {};
    const parent = {};
    const cycles = [];
    const cards = REGISTRY.cards || {};
    const dfs = u => {
      color[u] = 1;
      for(const v of (cards[u] ? (cards[u].depends_on || []) : [])){
        if(color[v] === 1){
          const path = [u];
          let p = parent[u];
          while(p !== undefined && p !== v){ path.push(p); p = parent[p]; }
          path.push(v);
          cycles.push(path.reverse());
        } else if(!color[v]){ parent[v] = u; dfs(v); }
      }
      color[u] = 2;
    };
    for(const cid in cards){ if(!color[cid]) dfs(cid); }
    return cycles;
  }

  function renderDependencies(){
    const cards = REGISTRY.cards || {};
    const blocks = {};
    for(const [cid, c] of Object.entries(cards)){
      for(const d of (c.depends_on || [])) (blocks[d] = blocks[d] || []).push(cid);
    }
    const vis = sortedVisible();
    const cycles = findCycles();
    const notRetired = ([cid,c]) => !(c.retired || c.lifecycle === "RETIRED");
    const orphans = vis.filter(([cid,c]) => !(c.depends_on || []).length && !(blocks[cid] || []).length && notRetired([cid,c]));
    const noOwner = vis.filter(([cid,c]) => !c.owner && notRetired([cid,c]));
    const noAcc = vis.filter(([cid,c]) => !(c.acceptance || "").trim() && notRetired([cid,c]));
    const frozenCards = vis.filter(([cid,c]) => frozenTasks(c).length);
    let html = `<h2 class="vtitle">DEPENDENCIES :: CARD GRAPH + CRITICAL PATH</h2>
      <div class="vsub">depends_on = структурные предусловия · blocks = обратные зависимости (кто ждёт эту карточку) · зависимость в DESIGN не блокирует research, но блокирует BUILD · критический путь = ранние карточки, транзитивно держащие максимум зависимых · read-only</div>`;
    const stat = (label, arr, col) => `<span class="na-stat" style="${col ? "color:"+col+";border-color:"+col : ""}">${label} <b>${arr.length}</b></span>`;
    html += `<div class="depstat-row">
      ${stat("CYCLES", cycles, cycles.length ? "#ff6b6b" : "")}
      ${stat("ORPHANS", orphans)}
      ${stat("NO OWNER", noOwner)}
      ${stat("NO ACCEPTANCE", noAcc)}
      ${stat("FROZEN-BLOCKED", frozenCards, frozenCards.length ? "#ff6b6b" : "")}
    </div>`;
    if(cycles.length){
      html += `<div class="na-sec">⚠ CYCLES — depends_on должен быть DAG</div>`;
      html += cycles.map(cy => `<div class="na-row" style="border-left-color:#ff6b6b">
          <div class="na-main"><div class="na-reason"><span class="bad">цикл:</span> ${cy.map(x => `<span class="depchip" data-card="${esc(x)}">${esc(x)}</span>`).join(" → ")}</div></div>
        </div>`).join("");
    }
    const trans = blocksTransitively();
    const ranked = Object.entries(trans).map(([cid, set]) => ({cid, n: set.size})).filter(x => x.n > 0).sort((a,b) => (b.n - a.n) || (a.cid < b.cid ? -1 : 1));
    if(ranked.length){
      html += `<div class="na-sec">✸ CRITICAL PATH — ЧТО ТРАНЗИТИВНО ДЕРЖИТ БОЛЬШЕ ВСЕГО</div>`;
      html += ranked.slice(0, 6).map(x => {
        const c = cards[x.cid];
        const col = LIFECYCLE_COLOR[c.lifecycle] || "#666";
        const targets = [...trans[x.cid]].sort().slice(0, 12);
        const more = trans[x.cid].size - targets.length;
        return `<div class="na-row" style="border-left-color:${col}">
          <span class="na-id" data-card="${esc(x.cid)}">${esc(x.cid)} <span style="opacity:.6;font-size:9px">${esc(c.lifecycle)}</span></span>
          <div class="na-main">
            <div>${esc(c.title)}</div>
            <div class="na-reason"><span class="bad">держит ${x.n}</span> · ${targets.map(t => `<span class="depchip" data-card="${esc(t)}">${esc(t)}</span>`).join(" ")}${more > 0 ? ` <span class="dim">+${more} ещё</span>` : ""}</div>
          </div>
        </div>`;
      }).join("");
    }
    const listChips = arr => arr.map(([cid]) => `<span class="depchip" data-card="${esc(cid)}">${esc(cid)}</span>`).join(" ") || '<span class="dim">—</span>';
    html += `<div class="na-sec">◇ ЦЕЛОСТНОСТЬ ГРАФА</div>
      <div class="na-row"><div class="na-main"><div class="na-reason">ORPHANS (нет deps и blocks): ${listChips(orphans)}</div></div></div>
      <div class="na-row"><div class="na-main"><div class="na-reason">NO OWNER: ${listChips(noOwner)}</div></div></div>
      <div class="na-row"><div class="na-main"><div class="na-reason">NO ACCEPTANCE: ${listChips(noAcc)}</div></div></div>
      <div class="na-row"><div class="na-main"><div class="na-reason">FROZEN (task в Blocked/Frozen): ${listChips(frozenCards)}</div></div></div>
      <div class="na-sec">▤ ТАБЛИЦА ЗАВИСИМОСТЕЙ</div>
      <table class="vtable"><tr><th>CARD</th><th>STAGE</th><th>DEPENDS ON</th><th>BLOCKS</th></tr>`;
    for(const [cid, c] of vis){
      const deps = (c.depends_on || []).map(d => {
        const dc = cards[d];
        const dcol = dc ? (LIFECYCLE_COLOR[dc.lifecycle] || "#666") : "#ff6b6b";
        const mark = !dc ? " ⛔?" : (dc.lifecycle === "RETIRED" || dc.retired ? " ⛔retired" : "");
        return `<span class="depchip" data-card="${esc(d)}" style="color:${dcol};border-color:${dcol}">${esc(d)}${dc ? " " + esc(dc.lifecycle) : " ?"}${mark}</span>`;
      }).join("") || '<span class="dim">—</span>';
      const bl = (blocks[cid] || []).slice().sort()
        .map(b => `<span class="depchip" data-card="${esc(b)}">${esc(b)}</span>`).join("") || '<span class="dim">—</span>';
      const col = LIFECYCLE_COLOR[c.lifecycle] || "#666";
      const fr = frozenTasks(c).length ? ` <span style="color:#ff6b6b">⛔</span>` : "";
      html += `<tr><td><span class="depchip" data-card="${esc(cid)}" style="color:${col};border-color:${col}">${esc(cid)}</span> ${esc(c.title)}${fr}</td>
        <td style="color:${col}">${esc(c.lifecycle)}</td><td>${deps}</td><td>${bl}</td></tr>`;
    }
    html += `</table>`;

  function renderAcceptance(){
    const vis = sortedVisible().filter(([cid,c]) => c.lifecycle !== "RETIRED" && !c.retired);
    /* stage-группировка для roadmap-шапки */
    const track = ["RESEARCH","DESIGN","BUILD","REVIEW","VERIFY","LIVE"];
    let html = `<h2 class="vtitle">ACCEPTANCE DASHBOARD :: EVIDENCE PER CARD</h2>
      <div class="vsub">acceptance = доказательство перехода lifecycle · evidence = artifacts + tasks (self-declared маркеры — не evidence) · verdict = наличие verifier/acceptance записи · LIVE gate = что запрещает переход · VERIFY→LIVE только с runtime evidence · read-only</div>
      <div class="depstat-row">${track.map(t => `<span class="na-stat" style="color:${LIFECYCLE_COLOR[t]||"#666"};border-color:${LIFECYCLE_COLOR[t]||"#666"}">${t} <b>${vis.filter(([ ,c]) => c.lifecycle === t).length}</b></span>`).join("")}</div>`;
    if(!vis.length){
      html += `<div class="no-snapshot">— нет карточек под текущими фильтрами —</div>`;
      return html;
    }
    for(const [cid, c] of vis){
      const col = LIFECYCLE_COLOR[c.lifecycle] || "#666";
      const artifacts = (c.artifacts || []).map((a, i) => `<span class="tid">${esc(a)}</span>`).join("") || '<span class="dim">—</span>';
      const tasks = (c.tasks || []).map(t => {
        const sec = taskSection(t);
        return `<span class="tid">${esc(t)}${sec ? ` <span style="color:var(--amber)">[${esc(sec)}]</span>` : ""}</span>`;
      }).join(" ") || "—";
      // verdict: принимаем evidence только если есть артефакты ИЛИ задачи ДНЕ; runtime-записи для VERIFY карточек
      const hasArtifacts = (c.artifacts || []).length > 0;
      const doneTasks = (c.tasks || []).filter(t => taskSection(t) === "Done");
      const hasDone = doneTasks.length > 0;
      const verifierMention = /verifier.*(PASS|PASSED)|PASS.*(verifier|acceptance)/i.test(c.status_note || "");
      const selfPass = /PASS/i.test(c.status_note || "") && !verifierMention;
      let verdict = "none", verdictLabel = "NO EVIDENCE";
      if(verifierMention) { verdict = "pass"; verdictLabel = "VERIFIER PASS"; }
      else if(selfPass) { verdict = "pending"; verdictLabel = "SELF-PASS (needs verifier)"; }
      else if(hasArtifacts || hasDone) { verdict = "pending"; verdictLabel = "PARTIAL (artifacts/tasks)"; }
      // LIVE gate: что запрещает переход в LIVE для VERIFY-карточек
      let gate = [];
      if(c.lifecycle === "VERIFY"){
        if(!runtimeEvidence(c)) gate.push("нет runtime evidence / verifier acceptance");
        if(c.tasks && c.tasks.some(t => taskSection(t) === "Blocked")) gate.push("frozen-задача в TASKS Blocked");
        if(/BLOCKED/i.test(c.status_note || "")) gate.push("status_note: implementation BLOCKED");
        if(!gate.length) gate.push("verifier acceptance pending → LIVE (runtime evidence обязательны)");
