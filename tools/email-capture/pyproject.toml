[project]
name = "vibeos-email-capture"
version = "0.1.0"
description = "Ручной IMAP-CLI: письма Gmail → классификация по интентам вайбкодинга → append в idea-graph"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["capture", "classifier", "writer", "state", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not smoke'"
markers = [
    "smoke: живой прогон по реальному IMAP (нужен аккаунт и явный запуск pytest -m smoke)",
]
