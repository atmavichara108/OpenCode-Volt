[project]
name = "vibeos-model-bench"
version = "0.1.0"
description = "Детерминированный capability-probe моделей (4 гейта) — advisory-выход для model-routing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "config",
    "tasks",
    "graders",
    "client",
    "bench",
    "report",
]

[tool.pytest.ini_options]
markers = [
    "smoke: живой прогон с реальным провайдером (нужен --smoke)",
]
